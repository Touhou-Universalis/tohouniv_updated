l_french:
 ###RAN MISSIONS, COLUMN 1: THE RUSSIAN LANDS###
 RAN_first_request_title: "Yukari's First Request: Novgorod"
 RAN_first_request_desc: "Novgorod is fat, rich and slow, and its lands touch yours on every side. Start there, Ran. I want to see Novgorod's banners hanging in your hall by spring."
 RAN_humble_novgorod_title: "Humble Novgorod"
 RAN_humble_novgorod_desc: "Novgorod's merchants still think a council of old men can say no to me. Teach them otherwise. Gently if you can, thoroughly if you must."
 RAN_master_of_the_north_title: "Master of the North"
 RAN_master_of_the_north_desc: "The whole north answers to a fox now. Count it, measure it, and send me the numbers. I know you enjoy that part."
 RAN_offer_gap_to_moscow_title: "Yukari's Offer: A Gap to Moscow"
 RAN_offer_gap_to_moscow_desc: "Muscovy is being stubborn. I could open a little gap in the Kremlin walls for you. You only have to ask, Ran."
 RAN_break_muscovy_title: "Break Muscovy"
 RAN_break_muscovy_desc: "Moscow fancies itself the heir of the Rus'. Let's see how it likes being the heir of nothing. Take the Kremlin, and every Russian who listened to Moscow will listen to a fox instead."
 RAN_gather_the_rus_title: "Gather the Rus'"
 RAN_gather_the_rus_desc: "Every Russian principality under one tail. Well, nine tails. The humans will want a crown on your head and a new name on the map. Now choose where you'll sit, Ran. Kholmogory was only ever a den."
 RAN_kiev_title: "Kiev, Mother of Rus' Cities"
 RAN_kiev_desc: "The old mother city of the Rus' is still in someone else's hands. Bring her home, and the wild Cossack hosts of the steppe with her. Then look west; the Polish crown sits on a shaky head."
 RAN_commonwealth_title: "Lithuania and Poland"
 RAN_commonwealth_desc: "The Lithuanians kept their old gods longer than anyone in Europe, and the Poles are proud, Catholic and in my way. Take their crown, their lands, or both."
 RAN_bohemia_title: "Bohemia and the Western Slavs"
 RAN_bohemia_desc: "Czechs, Slovaks, Silesians, Sorbs: Slavs who forgot they were Slavs. Remind them. And Bohemia has a vote for the imperial crown, which I find very interesting."

 ###TOOLTIPS###
 RAN_master_of_the_north_dev_tt: "Every province we own in the §YPomor§!, §YKarelia§!, §YNorth Karelia§!, §YBeloozero§! and §YVologda§! areas gains §G+1§! development."
 RAN_gap_muscovy_neighbour_tt: "§YMuscovy§! exists, is independent and borders us."
 RAN_gap_moskva_fallback_tt: "§YMuscovy§! no longer exists or is someone's subject, and we own §YMoskva§! or border its owner."
 RAN_gap_already_ours_hint_tt: "Yukari looks out of the window for a long moment, then laughs behind her fan and finishes the generals' tea. Only afterwards does Ran realise she never asked anyone's permission to take the city."
 RAN_gap_refuse_hint_tt: "The gap snaps shut, sounding faintly offended. Ran goes back to her maps, and only later notices that her hand never shook."
 RAN_east_slavic_accepted_tt: "The whole §YEast Slavic§! culture group becomes accepted: §YRussian§!, §YNovgorodian§!, §YRyazanian§!, §YByelorussian§! and §YRuthenian§!."
 RAN_gather_the_rus_90_tt: "Own at least §Y52§! provinces in the §YRussia§! region, ourselves or through our subjects (90% of the region). Occupied provinces only count once a peace treaty hands them over. The map shows the ones still missing."
 RAN_renamed_tsardom_tt: "Our country is renamed the §YTsardom of the Fox§!."
 RAN_gather_the_rus_hint_tt: "The boyars bow and hail their Tsaritsa. For the first time in a thousand years, Ran forgets to glance over her shoulder to see whether Yukari approves."
 RAN_kiev_no_polish_cb_tt: "If §YPoland§! existed, were a monarchy and were not our subject, we would gain a casus belli for the Polish throne for 20 years."
 RAN_lithuanian_polish_accepted_tt: "§YLithuanian§! and §YPolish§! become accepted cultures."
 RAN_west_slavic_accepted_tt: "The rest of the §YWest Slavic§! culture group becomes accepted: §YCzech§!, §YSlovak§!, §YSilesian§! and §YSorbian§!."
 RAN_kitsunegrad_chain_tt: "Work on a new city at §YNeva§! begins. It will take about §Y8 years§!, and we must still own Neva when it is finished."
 RAN_neva_delay_tt: "The new city will be finished §R2 years§! later."
 RAN_neva_work_goes_on_tt: "Work on the new city at §YNeva§! goes on. It should be finished in about §Y8 years§!."
 RAN_neva_on_schedule_tt: "The new city stays on schedule."
 RAN_neva_finish_tt: "The new city will be finished in about §Y3 years§!."
 RAN_throne_postponed_tt: "The decision §YA Throne for the Fox§! becomes available, so we can choose our capital later."
 ran_throne_for_the_fox_allow_tt: "We own §YMoskva§!, or we own §YNeva§! and have at least §Y1000§! ducats."

 ###COUNTRY NAME###
 RAN_FOX_TSARDOM: "Tsardom of the Fox"
 RAN_FOX_TSARDOM_ADJ: "Fox"

 ###DECISIONS###
 ran_throne_for_the_fox_title: "A Throne for the Fox"
 ran_throne_for_the_fox_desc: "The Tsardom still has no proper capital, and ambassadors keep getting lost in the snow around Kholmogory. Choose one: Moscow, or a new city on the Neva for 1000 ducats."

 ###MERCENARIES###
 merc_th_moscow_streltsy: "Moscow Streltsy"
 th_unlock_merc_th_moscow_streltsy_tt: "Unlock the §YMoscow Streltsy§! mercenary company. Like every mercenary company, it fills its ranks from its own manpower, not ours."
 th_has_unlocked_merc_th_moscow_streltsy_tt: "Has the mercenary company §YMoscow Streltsy§! unlocked."
 merc_th_yermak_cossacks: "Yermak's Cossacks"
 th_unlock_merc_th_yermak_cossacks_tt: "Unlock the §YYermak's Cossacks§! mercenary company. Like every mercenary company, it fills its ranks from its own manpower, not ours."
 th_has_unlocked_merc_th_yermak_cossacks_tt: "Has the mercenary company §YYermak's Cossacks§! unlocked."

 ###MODIFIERS###
 ran_yukaris_encouragement: "Yukari's Encouragement"
 desc_ran_yukaris_encouragement: "Yukari has promised to watch the war on Novgorod with great interest. The soldiers are not sure whether this is meant to be encouraging."
 ran_fox_blessed_market: "Fox-Blessed Market"
 desc_ran_fox_blessed_market: "A small fox shrine now stands in Novgorod's market square. Merchants leave a coin on it before every deal, and the deals have been going suspiciously well."
 ran_bound_like_shikigami: "Bound Like Shikigami"
 desc_ran_bound_like_shikigami: "Ran knows how a good binding works from the inside. Our subjects find that the terms she writes are very hard to wriggle out of."
 ran_silenced_bell: "Silenced Bell"
 desc_ran_silenced_bell: "The veche bell was taken down and carried north. Novgorod has gone quiet, which is not the same as content."
 ran_bell_rings_for_ran: "The Bell Rings for Ran"
 desc_ran_bell_rings_for_ran: "The veche bell still rings over Novgorod's market. These days it calls the merchants to trade in the fox's name."
 ran_northern_granary: "Northern Granary"
 desc_ran_northern_granary: "Ran has counted every barn and field in the north, twice, and rearranged them all into a much better order."
 ran_gaps_in_the_kremlin: "Gaps in the Kremlin"
 desc_ran_gaps_in_the_kremlin: "Strange gaps keep opening in the walls of Moscow. Some of them have eyes inside. The garrison would rather not talk about it."
 ran_yukaris_favour_moscow: "Yukari's Favour"
 desc_ran_yukaris_favour_moscow: "Supplies arrive through gaps, and walls have a way of crumbling just where our sappers are digging. Yukari is helping, and she wants everyone to know it."
 ran_own_plan: "Ran's Own Plan"
 ran_ahead_of_schedule: "Ahead of Schedule"
 desc_ran_ahead_of_schedule: "Moscow fell before Yukari woke up to offer her help. The paperwork for the new lands is already done, in triplicate, and filed in alphabetical order."
 desc_ran_own_plan: "Ran turned down Yukari's help and is taking Moscow with her own calculations. The calculations are very good."
 ran_muscovite_levies: "Muscovite Levies"
 desc_ran_muscovite_levies: "The men of Moscow fought hard against the fox. Now they fight just as hard for her."
 ran_gatherer_of_the_rus: "Gatherer of the Rus'"
 desc_ran_gatherer_of_the_rus: "The princes of Moscow spent two centuries gathering the Russian lands. A fox finished the job."
 ran_heart_of_the_rus: "Heart of the Rus'"
 desc_ran_heart_of_the_rus: "The fox rules from the Kremlin, in the old heart of the Rus'. Even the most stubborn boyar has to admit it looks right."
 ran_italianate_palaces: "Italianate Palaces"
 desc_ran_italianate_palaces: "Italian architects have filled the city on the Neva with palaces and squares. Merchants come from far away just to stare at them, and while they are here they buy and sell."
 ran_dutch_shipwrights: "Dutch Shipwrights"
 desc_ran_dutch_shipwrights: "Dutch masters run the shipyards on the Neva. They build ships quickly and cheaply, train the local sailors their own way, and complain about the weather constantly."
 ran_french_salons: "French Salons"
 desc_ran_french_salons: "Half the boyar families of the Tsardom now keep a house near the French gardens on the Neva. They come for the salons and the gossip, and they pay their taxes here while they are at it."
 ran_city_on_the_neva: "City on the Neva"
 desc_ran_city_on_the_neva: "Kitsunegrad faces the sea and the West beyond it. New ideas arrive here first, usually by ship."
 ran_northern_capital: "The Northern Capital"
 desc_ran_northern_capital: "Built on a marsh by sheer stubbornness, Kitsunegrad is our capital, our port and our window to the world."
 ran_mother_of_cities: "Mother of Cities"
 desc_ran_mother_of_cities: "Kiev, the oldest city of the Rus', is home again. Masons swarm over its old churches, and every one of them wants to be the one who puts the golden domes back."
 ran_zaporozhian_hosts: "Zaporozhian Hosts"
 desc_ran_zaporozhian_hosts: "The Cossacks of the Dnieper ride for the fox now. They are loud, fast and very hard to keep in formation."
 ran_partitioner: "Partitioner"
 desc_ran_partitioner: "We have taken apart the Polish-Lithuanian lands with great precision. Our neighbours have learned that complaining does not help."
 ran_city_of_a_hundred_spires: "City of a Hundred Spires"
 desc_ran_city_of_a_hundred_spires: "Prague's towers, scholars and workshops now belong to the fox. Ran counted the spires. There are more than a hundred."

 ###EVENTS###
 flavor_ran.10.t: "The Veche Bell"
 flavor_ran.10.desc: "For centuries a bell in Novgorod's market square has called the veche, the assembly where merchants and boyars shout at each other until somebody wins. It rang the day our army arrived, too. Several times. Mostly out of panic.\n\nThe bell is still there, and the townsfolk keep glancing at it. Some of Ran's officials want it taken down and carried north, so that Novgorod remembers who rules now. Others point out that a city that likes ringing bells is a city that likes trading, and trade is the whole reason Novgorod was worth taking."
 flavor_ran.10.a: "Take it down. Kholmogory needs a bell more than they do."
 flavor_ran.10.b: "Let it ring. Just make sure it rings for us."
 flavor_ran.11.t: "A Gap to Moscow"
 flavor_ran.11.desc: "A gap opened in the middle of Ran's war council this morning. A parasol came out of it, followed by Yukari.\n\n\"Moscow's walls are rather thick,\" she said, helping herself to the generals' tea. \"I could make them a little less thick. A gap here, a gap there. Nobody would ever know.\" She smiled in the way that always means somebody will know, eventually.\n\nThe generals looked at Ran. With Yukari's help, the war on Moscow would be much shorter. Then again, Ran has spent months planning this campaign, and it is a very good plan."
 flavor_ran.11.a: "Thank you, Yukari-sama. Please open the gaps."
 flavor_ran.11.b: "With respect, I would like to try my own plan."
 flavor_ran.11.desc_ours: "A gap opened in the middle of Ran's war council this morning. A parasol came out of it, followed by Yukari.\n\n\"Moscow's walls are rather thick,\" she said, helping herself to the generals' tea. \"I could make them a little less thick. A gap here, a gap there. Nobody would ever know.\"\n\nThe generals looked at each other, then at the window. Through it, quite clearly, stands the Kremlin, with our banners on every tower. The council is being held in Moscow. It has been for months."
 flavor_ran.11.c: "We took it in spring, Yukari-sama. You were asleep."
 flavor_ran.12.t: "A Fox in the Kremlin"
 flavor_ran.12.desc: "The Kremlin is very quiet once the Grand Prince's court has gone. Ran walks its halls alone, counting the rooms out of habit. There are a great many of them, plus a cellar that the servants swear is haunted. It isn't. Ran checked.\n\nIn the throne room, the princes of Moscow look down from the walls, painted with stern faces and very long beards. For two hundred years they gathered the Russian lands one principality at a time. Ran calculates that, at her pace, she will finish the job in a fraction of that. She does not say so out loud. It seems rude to the portraits."
 flavor_ran.12.a: "Dust off the throne. There is work to do."
 flavor_ran.13.t: "A Throne for the Fox"
 flavor_ran.13.desc: "Every Russian principality now answers to the fox, and the boyars have started asking awkward questions, such as where exactly the new Tsaritsa intends to live. Kholmogory was fine for a shrine and a den. It is less fine for receiving ambassadors, who keep getting lost in the snow.\n\nMoscow is the obvious answer: old, holy, and already full of thrones. But Ran has her eye on the marshes where the Neva meets the sea. A new city there would cost a fortune and take years, and it would face west, towards everything Yukari wants next."
 flavor_ran.13.a: "Moscow. It has walls, and the walls have a throne."
 flavor_ran.13.b: "Build a new city on the Neva. Spare no expense."
 flavor_ran.13.c: "Kholmogory will do. For now."
 flavor_ran.14.t: "Stakes in the Marsh"
 flavor_ran.14.desc: "On a muddy island at the mouth of the Neva, Ran drives the first stake into the ground herself. The stake sinks out of sight. So does the second one. The engineers explain, carefully, that the whole site is mostly water with opinions.\n\nRan has already done the maths. It will take a great many stakes, a great many workers and about eight years. The workers have done the maths too, and they are less cheerful about it."
 flavor_ran.14.a: "More stakes. Then more stakes after that."
 flavor_ran.15.t: "The Neva Floods"
 flavor_ran.15.desc: "The Neva rose overnight and swept months of work out to sea, along with several boats, a warehouse and one very surprised engineer, who was later found clinging to a buoy.\n\nThe foremen say they can make up the lost time if we hire more workers and buy more timber at once. Otherwise the city will simply have to wait. The river, they add, will probably do this again."
 flavor_ran.15.a: "Pay whatever it takes. The city rises on time."
 flavor_ran.15.b: "Let it wait. The river is in no hurry, and neither are we."
 flavor_ran.16.t: "Architects from the West"
 flavor_ran.16.desc: "The new city is starting to look like a city, so it is time to decide what kind. Architects from three countries have arrived with plans, models and very firm opinions about each other. Each of them has also brought a name for the city. Ran has turned down all three.\n\nThe Italians want palaces and squares that will make every visiting merchant stop and stare. The Dutch want canals, docks and the finest shipyards in the north. The French want salons and gardens, and they swear that once the boyars see them, every noble family in the Tsardom will want a house on the Neva."
 flavor_ran.16.a: "Italian palaces. Let the merchants stare."
 flavor_ran.16.b: "Dutch docks. A port needs ships."
 flavor_ran.16.c: "French salons. The boyars will want to live here."
 flavor_ran.17.t: "The Northern Capital"
 flavor_ran.17.desc: "Years of work, countless stakes and at least one flood later, the city on the Neva is finished. Its canals run straight to the sea, and its palaces face west as if daring someone to come and look.\n\nThe boyars wanted a saint's name for it. Ran wrote Kitsunegrad, the Fox's City, at the top of the charter and did not ask for a vote. The first half is a word from Gensokyo, and the clerks are still learning to spell it. The stonemasons had no such trouble and carved nine-tailed foxes over the main gate. Kholmogory keeps its shrine, and the pilgrims keep coming."
 flavor_ran.17.desc_lost: "The workers on the Neva have downed their tools. The site is no longer ours, and whoever holds it now is unlikely to finish a capital for us.\n\nRan files the plans away carefully. A fox never throws away a good plan. She only waits for a better moment."
 flavor_ran.17.a: "Welcome to the new capital of the Tsardom."
 flavor_ran.17.b: "File the plans away. We will choose a throne again."

 ###RAN MISSIONS, COLUMN 2: NORTH AND WEST###
 RAN_white_sea_trade_title: "Rule the White Sea"
 RAN_white_sea_trade_desc: "Every fur and fish leaving the north passes through our sea. Make sure the profit stays with us. Keep a merchant there. The English and Dutch can buy their furs from us, at our price."
 RAN_port_of_arkhangelsk_title: "A Fox Needs a Harbour"
 RAN_port_of_arkhangelsk_desc: "Lady Ran has done the sums. A proper harbour at Soroka, with a real shipyard and warehouses that don't leak, pays for itself in eleven summers. Build it, and give it a fleet worth the trouble. Yes, the White Sea freezes half the year. She has put that in the sums too."
 RAN_baltic_coast_title: "Close the Baltic"
 RAN_baltic_coast_desc: "The Livonian knights sit on the Baltic shore in rusting armour. Take Riga and the coast, and nobody sails east without paying a fox."
 RAN_karelia_finland_title: "Karelia and Finland"
 RAN_karelia_finland_desc: "Across the lakes, the Finns and Karelians still bow to Swedish bailiffs and listen to Swedish priests. They have old tales of clever foxes too, you know. Go and remind them how those stories end."
 RAN_humble_sweden_title: "Humble Sweden"
 RAN_humble_sweden_desc: "The Swedes call themselves the lions of the north. A lion is just a big cat, and I already have one of those~"
 RAN_scandinavia_united_title: "All of Scandinavia"
 RAN_scandinavia_united_desc: "Denmark and Norway next. When the whole north is ours, the Baltic becomes a fox's pond. Take Copenhagen and its strait, and every ship leaving the Baltic will bow as it passes."
 RAN_window_to_europe_title: "A Window to Europe"
 RAN_window_to_europe_desc: "Why should a ship from Amsterdam pay a dozen middlemen to reach us? Make the Neva Russia's front door, and let Europe come knocking with its cargoes, its gossip and its clever ideas."
 RAN_great_embassy_title: "The Great Embassy"
 RAN_great_embassy_desc: "Put on a human face and travel west, Ran. Look at their shipyards and universities, and bring back whatever is worth stealing. You'll be on your own; I'll be asleep."
 RAN_boundary_of_the_empire_title: "The Boundary of the Empire"
 RAN_boundary_of_the_empire_desc: "The Empire is only a boundary drawn by men, and boundaries are my speciality. Hold enough of it and I will redraw it for you."
 RAN_charm_the_electors_title: "Charm the Electors"
 RAN_charm_the_electors_desc: "Seven old men choose an emperor. Foxes have been charming old men for a thousand years. Prague showed you the way into the Empire; now win the men who vote."
 RAN_empress_of_the_hre_title: "Empress of the HRE"
 RAN_empress_of_the_hre_desc: "Wear the crown, Ran. Whether they elected you or simply forgot that they didn't is not important. The Empire has had stranger rulers, though not many. Try not to let your tails show."
 RAN_mistress_of_europe_title: "Mistress of Europe"
 RAN_mistress_of_europe_desc: "Europe has many crowns. I only care that every one of them bows to the same fox. Be the greatest power on the continent, and make the electors ours, by faith or by leash."

 ###TOOLTIPS, COLUMN 2###
 RAN_finnish_karelian_accepted_tt: "§YFinnish§! and §YKarelian§! become accepted cultures."
 RAN_window_capital_tt: "If §YNeva§! (Kitsunegrad) were our capital, we would also gain §G+10%§! trade efficiency permanently."
 RAN_four_institutions_tt: "Has embraced at least §Y4§! institutions."
 RAN_two_european_allies_tt: "Has at least §Y2§! allies with their capital in Europe."
 RAN_boundary_effect_tt: "Yukari moves the Empire's border: we join the §YHoly Roman Empire§! and gain §G+25§! prestige. If the Empire is gone, we instead gain §G+25§! prestige and claims on every German province that borders ours."
 RAN_boundary_gone_claims_tt: "Gain permanent claims on every province in the §YNorth German§! and §YSouth German§! regions that borders ours."
 RAN_four_charmed_electors_tt: "At least §Y4§! electors have been charmed with the §YFox's Charm§! and still have at least §Y100§! opinion of us."
 RAN_four_charmed_germans_tt: "At least §Y4§! countries with their capital in the §YNorth German§! or §YSouth German§! region have been charmed with the §YFox's Charm§! and still have at least §Y100§! opinion of us."
 RAN_hre_faith_tt: "§YNine-Tailed Shinto§! becomes the Empire's official faith (not locked). Only its followers can be elected Emperor."
 RAN_empress_by_charm_tt: "At least §Y5§! electors have been charmed with the §YFox's Charm§!, and our army is at least §Y3 times§! as strong as the Emperor's."
 RAN_empress_effect_tt: "We become §YEmperor§! if we are not already, and gain §G+25§! imperial influence. If the Empire is gone, we instead gain §G+50§! prestige and claims on the §YNorth German§! and §YSouth German§! regions."
 RAN_four_loyal_electors_tt: "At least §Y4§! electors are our subjects or share our faith."
 RAN_hre_faith_locked_tt: "§YNine-Tailed Shinto§! becomes the Empire's official faith and is §Ylocked§! for good."

 ###FOX'S CHARM (diplomatic action)###
 ran_fox_charm_title: "Fox's Charm"
 ran_fox_charm_desc: "Spend §R50§! diplomatic power to charm §Y[From.GetName]§!. They gain §G+75§! opinion of us permanently ('Charmed by a Fox') and §G+15§! trust. A country can only be charmed once."
 ran_fox_charm_tooltip: "Charm another ruler with nine tails' worth of courtesy."
 ran_fox_charm_not_charmed_tt: "§Y[From.GetName]§! has not been charmed yet."

 ###OPINIONS AND POWER PROJECTION###
 ran_charmed_by_fox: "Charmed by a Fox"
 ran_enchanted_by_fox: "Enchanted by a Fox"
 ran_sound_dues_opinion: "The Sound Dues"
 ran_permanent_power_projection: "Mistress of Europe §Y(Permanent)§!"

 ###MODIFIERS, COLUMN 2###
 ran_fox_toll: "Fox Toll"
 desc_ran_fox_toll: "Every bale of fur and barrel of fish that leaves the White Sea now pays a small toll to the fox. Nobody remembers agreeing to it."
 ran_fox_harbour: "Fox Harbour"
 desc_ran_fox_harbour: "Soroka's docks hum all summer and freeze all winter. While the ice is out, the warehouses fill faster than the clerks can count, and Ran's clerks count very fast."
 ran_northern_steel: "Northern Steel"
 desc_ran_northern_steel: "Swedish iron and Swedish veterans have joined our regiments. The veterans are still getting used to taking orders from a fox."
 ran_northern_dominion: "Northern Dominion"
 desc_ran_northern_dominion: "From the White Sea to the Sound, every northern harbour flies the fox's banner."
 ran_sound_dues: "The Sound Dues"
 desc_ran_sound_dues: "Every ship entering the Baltic pays at Helsingør, and the list of dues grows a little longer every year."
 ran_free_passage: "Free Passage"
 desc_ran_free_passage: "We opened the Sound to every flag. Foreign courts remember the favour."
 ran_window_to_europe: "The Window to Europe"
 desc_ran_window_to_europe: "Ships from all over Europe sail straight to the Neva, and every cargo smuggles in a few new ideas between the barrels."
 ran_window_merchants: "Merchants of the Neva"
 desc_ran_window_merchants: "Our merchants learned their trade haggling with Dutch skippers on the Neva docks. After that, nobody else seems difficult."
 ran_window_capital: "Capital on the Sea"
 desc_ran_window_capital: "Our capital is also our greatest port. Trade flows through the palace windows, nearly literally."
 ran_amsterdam_shipyards: "Amsterdam Shipyards"
 desc_ran_amsterdam_shipyards: "Ran spent a month in an Amsterdam shipyard with tar in her hair. Our shipwrights now build the Dutch way: faster, cheaper, and with a great deal more swearing."
 ran_konigsberg_gunnery: "Königsberg Gunnery"
 desc_ran_konigsberg_gunnery: "In Königsberg, Ran passed the gunnery course with full marks and corrected the instructor twice. Our gunners now train her way, and our engineers dig their trenches by her drawings."
 ran_leiden_learning: "Leiden Learning"
 desc_ran_leiden_learning: "Ran came back from Leiden with notebooks full of lectures, all copied in very neat handwriting. Our new academies teach from them, and the professors find few mistakes to correct."
 ran_mistress_of_europe: "Mistress of Europe"
 desc_ran_mistress_of_europe: "No crown in Europe stands above the fox's. Even her rivals now ask her permission before they argue."

 ###EVENTS, COLUMN 2###
 flavor_ran.20.t: "Lions and Foxes"
 flavor_ran.20.desc: "The Swedish envoys arrived in full armour under a banner with a golden lion, and left the hall rather quieter. The lions of the north have agreed to every one of Ran's terms, mostly because she had already written down their objections and answered each one in the margin.\n\nAt the farewell dinner, a Swedish marshal asked Ran, very carefully, whether it was true that foxes eat lions. Ran said no: foxes eat chickens, and lions are just cats with good publicity. The marshal laughed. Nobody else at the table was sure whether they were allowed to."
 flavor_ran.20.a: "A lion is just a big cat. I know how to handle cats."
 flavor_ran.21.t: "The Sound Toll"
 flavor_ran.21.desc: "Every ship that sails into the Baltic passes within cannon shot of Helsingør, and for two hundred years the Danish crown made each one pay for the privilege. The castle, the cannons and the ledgers are now ours.\n\nThe treasury officials have already drafted a new list of dues, longer than the old one and in much smaller handwriting. The foreign merchants, meanwhile, have sent a petition asking that the strait be opened to all. It is very politely worded and lists the gifts their governments would send in gratitude."
 flavor_ran.21.a: "Raise the dues. Every ship pays the fox."
 flavor_ran.21.b: "Open the strait. Friends are worth more than tolls."
 flavor_ran.22.t: "The Great Embassy"
 flavor_ran.22.desc: "Ran has spent a year travelling through Europe as a minor noblewoman with an unusually large hat. In Amsterdam she worked a month in a shipyard. In Königsberg she passed a gunnery course with full marks and corrected the instructor twice. In Leiden she sat in on lectures and asked questions that made two professors retire early.\n\nNobody saw through the disguise, but three men fell for her all the same. A master shipwright, a fortress engineer and a Leiden scholar have each offered to leave everything behind and follow her east. Ran insists she never even tried; she only smiled at them from behind her sleeve. Now the embassy is going home, and there is room in the carriage for one of them. Whoever she picks, his city's lessons will be the first ones taught at home."
 flavor_ran.22.a: "The shipwright from Amsterdam. He swears at ships, and they listen."
 flavor_ran.22.b: "The engineer from Königsberg. He draws fortresses in his sleep, and lately foxes."
 flavor_ran.22.c: "The scholar from Leiden. He says he has always wanted to see snow."
 flavor_ran.23.t: "The Boundary Moves"
 flavor_ran.23.desc: "The imperial diet woke up this morning to find that the Empire's border had moved overnight. The new line on the maps runs a thousand miles east and neatly around our capital. The old maps still exist, but every copy now has a small tear exactly where the border used to be.\n\nThe Emperor's lawyers have studied the matter and found no rule saying that the Empire's border cannot move by itself. Far away in Mayohiga, someone is laughing behind a fan."
 flavor_ran.23.desc_gone: "Yukari opened a gap over the old imperial border, looked through it for a while, and closed it again. \"There is nothing left to redraw,\" she wrote to Ran. \"The Empire has dissolved. How careless of them.\"\n\nShe enclosed a new map anyway. On it, several German provinces next to ours are circled in purple ink, with the word \"yours?\" written in the margin."
 flavor_ran.23.a: "Well. It seems we were always part of the Empire."
 flavor_ran.23.b: "Then we will take those German lands ourselves."
 flavor_ran.24.t: "A Fox on the Imperial Throne"
 flavor_ran.24.desc: "The imperial regalia arrived at our court in a closed carriage: crown, orb, sceptre and the Holy Lance, wrapped in velvet and escorted by very nervous knights. Whether the electors chose Ran, or simply could not remember choosing anyone else, is now a question for historians.\n\nRan tried on the crown in front of a mirror. It does not sit well between fox ears, so the court jeweller has been asked to make adjustments. He is working on two small holes."
 flavor_ran.24.desc_gone: "There is no Holy Roman Empire left to rule. Its electors are gone, its diets have stopped meeting, and its crown sits in a treasury that nobody visits. The German lands, however, are still there, and many of them are already ours.\n\nRan has decided that an empire is mostly paperwork, and she is very good at paperwork."
 flavor_ran.24.a: "The Empire has a fox on its throne now."
 flavor_ran.24.b: "We will gather the German lands as we gathered the Rus'."
 flavor_ran.25.t: "Crowned at Aachen"
 flavor_ran.25.desc: "In the cathedral at Aachen, beside Charlemagne's old throne, the electors of the Empire knelt one by one and swore loyalty to the fox. Some of them now pray at shrines with fox statues. The others know better than to comment.\n\nFrom this day the Empire's faith is fixed, and no election will ever undo it, partly because the Empress has no plans to die. Afterwards Ran wrote Yukari a long report. The reply came back in a single line: \"Good. Next.\""
 flavor_ran.25.desc_gone: "With no Empire left to crown anyone, Ran had herself crowned at Aachen anyway. The ceremony was short, the guest list was every ruler in Europe who owed her money, and attendance was perfect.\n\nNo crown in Europe now stands above hers. Afterwards Ran wrote Yukari a long report. The reply came back in a single line: \"Good. Next.\""
 flavor_ran.25.a: "Europe bows to the fox."
 ###COLUMN 3: THE FOX'S COURT###
 RAN_foxs_shrine_title: "The Fox's Shrine"
 RAN_foxs_shrine_desc: "Kholmogory is where these people first saw you. Spend a little gold and give them a shrine and a market. Wherever you rule from later, they'll keep walking back here to pray."
 RAN_fox_faith_title: "Tales by the Hearth"
 RAN_fox_faith_desc: "They already tell stories by the stove about a clever fox, and they still leave bread out for the old gods when the priest isn't looking. Give them a goddess who answers, Ran. Belief is what keeps Gensokyo alive."
 RAN_prikazy_title: "The Prikazy"
 RAN_prikazy_desc: "Humans can't run a country without paperwork. Set up the ministries and write the formulas they will follow. One office for taxes, one for soldiers, and one to watch the other two."
 RAN_chen_comes_north_title: "Chen Comes North"
 RAN_chen_comes_north_desc: "Your little shikigami keeps asking me where you went. Fine, I'll send her. Try not to spoil her. She has never seen snow this deep, and she will want to chase all of it."
 RAN_zemsky_sobor_title: "The Zemsky Sobor"
 RAN_zemsky_sobor_desc: "Call the nobles, the clergy and the merchants to court, feed them well, and let them argue for a week. They'll go home convinced that obeying you was their own idea."
 RAN_table_of_ranks_title: "The Table of Ranks"
 RAN_table_of_ranks_desc: "The boyars measure a man by his grandfather. Measure him by his sums instead. A Tatar, a Swede or a Finn who calculates well will serve you better than any prince with a long beard and a short memory."
 RAN_guberniyas_title: "The Guberniyas"
 RAN_guberniyas_desc: "Even nine tails can't cover a realm this size. Carve it into governorates, give each a governor and a ledger, and have every one of them report to you in neat columns on the same day of the month."
 RAN_academy_title: "The Academy of Calculations"
 RAN_academy_desc: "Humans can learn to calculate too, slowly, if someone patient teaches them. You are very patient, Ran. Found an academy, and tell me if any of them turn out to be worth keeping."
 RAN_dvoeverie_title: "Dvoeverie: the Double Faith"
 RAN_dvoeverie_desc: "These peasants pray to the saints on Sundays and leave milk for the house spirit every other night, and see no contradiction at all. Don't fight it, Ran. Just make sure both prayers end up at your door."
 RAN_belief_beyond_rus_title: "Belief Beyond Rus'"
 RAN_belief_beyond_rus_desc: "Russia believes. Now the rest of the Outside World must learn to fear and love a fox. A goddess with one people is a local spirit. A goddess with many is a power."
 RAN_gensokyo_grows_stronger_title: "Gensokyo Grows Stronger"
 RAN_gensokyo_grows_stronger_desc: "Can you feel it, Ran? The Barrier hums. Every human who believes in you makes Gensokyo a little more real. Back home, the youkai feel stronger than they have in centuries. Some even know your name."
 RAN_pilgrims_to_kholmogory_tt: "For as long as we own §YKholmogory§!, we get '§YPilgrims to Kholmogory§!': §G+0.5§! yearly legitimacy, §G+1%§! missionary strength."
 RAN_fox_charm_unlock_tt: "Unlocks the §YFox's Charm§! diplomatic action."
 RAN_fox_faith_convert_tt: "§YKholmogory§!, our capital and every province we own in the §YArkhangelsk§! area convert to §YNine-Tailed Shinto§!."
 RAN_fox_revelation_unlock_tt: "Unlocks the §YFox's Revelation§! diplomatic action: convert a charmed country to our faith."
 RAN_chen_general_tt: "§YChen§! joins our army as a general (Fire §G3§!, Shock §G4§!, Maneuver §G6§!, Siege §G2§!)."
 RAN_five_privileges_tt: "Has granted at least §Y5§! privileges in total to the §YNobility§!, §YClergy§! and §YBurghers§!."
 RAN_zemsky_sobor_reform_tt: "Our government reform becomes the §YNine-Tailed Autocracy§!: the same bonuses as the §YFox Principality§!, plus §YStreltsy§! units and the government mechanic §YThe Fox's Autocracy§!."
 RAN_assembly_privilege_unlock_tt: "Unlocks the noble privilege §YAssembly of the Land§!. It takes no privilege slot and gives §G+5%§! loyalty equilibrium for all estates, §G-10%§! stability cost and §G-1§! national unrest, for §R-5§! max absolutism."
 RAN_table_of_ranks_gauges_tt: "§YThe Fox's Autocracy§! becomes §YThe Fox's Rule§!: every gauge holds up to §G200§! and fills §Gtwice§! as fast, each gauge gives a bonus that grows as it fills, and the three buttons become the stronger §YThe Fox's Absolute Rule§!, §YThe Golden Census§! and §YFox-Fire Regiments§!. Our reform becomes the §YAutocracy of Ranks§!, and the power already gathered carries over."
 RAN_governing_capacity_not_exceeded_tt: "Governing capacity is not exceeded."
 RAN_academy_hint_tt: "In the margin of one of Yukari's old formulas, Ran writes a small correction in red ink. Her pen hovers over it for a long moment. Then she blots it dry and sends the page to the printers."
 RAN_dvoeverie_provinces_tt: "Every province we own that follows our §Ysyncretic faith§! gets '§YDvoeverie§!' permanently: §G-2§! local unrest, §G+10%§! local tax, §G+10%§! local manpower."
 RAN_dvoeverie_hint_tt: "Village grandmothers cross themselves at the church door, then leave a crust on the windowsill for the fox. Ran has started to hear those prayers. Not one of them mentions Yukari."
 RAN_fifty_faithful_outside_rus_tt: "At least §Y50§! provinces we own outside the §YRussia§! region follow our faith."
 RAN_belief_beyond_rus_hint_tt: "Ran dreams of the Barrier, humming like a struck bell. Voices drift through it in a dozen languages, all calling her name, not Yukari's. She wakes before dawn and lies very still, listening for more."
 RAN_strengthened_barrier_tt: "§YMayohiga§!, §YNether-Mayohiga§! and every country with its capital in §YGensokyo§! get '§YStrengthened Barrier§!' for §Y25§! years: §G-2§! national unrest, §G+10%§! goods produced, §G+10%§! national tax, §G+1§! yearly prestige."
 RAN_fox_absolute_rule_tt: "Every active estate agenda is completed at once, and any parliament debate ends."
 RAN_OPRICHNINA_LANDS_SEIZED: "Boyars' Lands Seized"
 Gensokyan_ran_tsardom: "Nine-Tailed Autocracy"
 Gensokyan_ran_tsardom_desc: "The Zemsky Sobor has spoken, and it said exactly what Ran wrote for it. The fox no longer merely rules the north: she runs it, through ministries, Streltsy regiments and a court that answers to her alone."
 Gensokyan_ran_tsardom_ranks: "Autocracy of Ranks"
 Gensokyan_ran_tsardom_ranks_desc: "Every servant of the fox now has a rank, a number and a column in Ran's ledgers. The machine of state runs smoother than ever, and holds more in reserve."
 ran_nine_governorates_reform: "The Nine Governorates"
 ran_nine_governorates_reform_desc: "Nine governorates, one for each tail. Every governor files the same report, in the same columns, on the same day of the month. Ran reads them all."
 unlock_ran_nine_governorates_reform_tt: "Unlocks the government reform '§YThe Nine Governorates§!': the gauges of §YThe Fox's Autocracy§! and §YThe Fox's Rule§! fill §G25%§! faster."
