 th_fox_oprichnina: "Kitsune Oprichnina"
 th_fox_oprichnina_desc: ""
 th_fox_streltsy: "Fox-Fire Streltsy"
 th_fox_streltsy_desc: ""
 th_fox_absolute_rule: "The Fox's Absolute Rule"
 th_fox_absolute_rule_desc: ""
 th_fox_golden_census: "The Golden Census"
 th_fox_golden_census_desc: ""
 th_fox_fire_regiments: "Fox-Fire Regiments"
 th_fox_fire_regiments_desc: ""
 th_estate_nobles_ran_assembly_of_the_land: "Assembly of the Land"
 th_estate_nobles_ran_assembly_of_the_land_desc: "The Zemsky Sobor will meet again whenever the sovereign calls it. Boyars, priests and merchants share the same benches, and all of them feel very consulted. The boyars still insist on the front row."
 ran_fox_revelation_title: "Fox's Revelation"
 ran_fox_revelation_desc: "Spend §R150§! diplomatic power to reveal the Nine-Tailed Goddess to §Y[From.GetName]§!. Their country and capital convert to our faith. Only charmed §Yallies§! or §Ysubjects§! with at least §Y80§! trust and §Y+150§! opinion of us can be converted, and never the Papal State."
 ran_fox_revelation_tooltip: "Show a charmed ruler who they have really been praying to."
 ran_fox_revelation_charmed: "Charmed by the Fox"
 ran_fox_autocracy_information_title: "About The Fox's Autocracy"
 ran_fox_autocracy_information_desc: "Explains how The Fox's Autocracy works."
 ran_pilgrims_to_kholmogory: "Pilgrims to Kholmogory"
 desc_ran_pilgrims_to_kholmogory: "Peasants walk for days to leave bread at the fox's shrine in Kholmogory, and go home with stories about the sovereign who answers prayers."
 ran_shrine_of_the_nine_tailed_fox: "Shrine of the Nine-Tailed Fox"
 desc_ran_shrine_of_the_nine_tailed_fox: "The first shrine of the Golden One. The pilgrims who visit it buy a great deal of fish on the way home."
 ran_zeal_of_a_new_faith: "Zeal of a New Faith"
 desc_ran_zeal_of_a_new_faith: "Nine-Tailed Shinto is young, and its believers have the zeal of people who have just discovered something wonderful and cannot stop telling the neighbours."
 ran_prikazy: "The Prikazy"
 desc_ran_prikazy: "Ministries, clerks and forms in triplicate. Ran designed every one of them personally."
 ran_assembly_boyars: "The Boyars Spoke First"
 desc_ran_assembly_boyars: "The boyars opened the Zemsky Sobor, and their sons now drill the fox's infantry."
 ran_assembly_clergy: "The Clergy Spoke First"
 desc_ran_assembly_clergy: "The clergy opened the Zemsky Sobor, and preach the sovereign's virtues with new energy."
 ran_assembly_merchants: "The Merchants Spoke First"
 desc_ran_assembly_merchants: "The merchants opened the Zemsky Sobor, and have been in a generous mood ever since."
 ran_table_of_ranks: "Table of Ranks"
 desc_ran_table_of_ranks: "Fourteen ranks, earned by merit. Anyone who calculates well can climb them, whatever their blood or tongue."
 ran_guberniya_system: "Guberniya System"
 desc_ran_guberniya_system: "The realm is divided into governorates, and every one of them reports to the fox in neat columns."
 ran_formulas: "Ran's Formulas"
 desc_ran_formulas: "The Academy of Calculations teaches Ran's methods. The students complain that the homework never ends."
 ran_dvoeverie: "Dvoeverie"
 desc_ran_dvoeverie: "The villagers pray to two faiths, to be on the safe side. Both prayers, as it happens, land on the same desk."
 ran_double_faith: "Double Faith"
 desc_ran_double_faith: "Our subjects light candles for saints and foxes alike, and nobody sees a problem with it."
 ran_goddess_blesses_the_harvest: "The Goddess Blesses the Harvest"
 desc_ran_goddess_blesses_the_harvest: "The Golden One watches over the fields, and the fields seem to know it."
 ran_fox_tales_spread: "Fox Tales Spread"
 desc_ran_fox_tales_spread: "Far beyond Rus', people tell stories about a golden fox who answers prayers."
 ran_fox_faithful: "The Fox's Faithful"
 desc_ran_fox_faithful: "The faithful march to war with a fox charm sewn into every coat. The sergeants have stopped asking why the charms are warm."
 ran_barrier_hums: "The Barrier Hums"
 desc_ran_barrier_hums: "So many humans now believe in the fox that the Hakurei Barrier hums like a plucked string. Even Reimu has noticed, between naps."
 ran_strengthened_barrier: "Strengthened Barrier"
 desc_ran_strengthened_barrier: "Faith in a fox far to the north has made the Hakurei Barrier stronger than it has been in centuries."
 ran_fox_fire_streltsy: "Fox-Fire Streltsy"
 desc_ran_fox_fire_streltsy: "The Streltsy load their muskets with a powder recipe Ran won't explain."
 ran_golden_census: "The Golden Census"
 desc_ran_golden_census: "Ran's clerks counted every soul, every acre and every excuse in the realm. The totals came out to the last kopeck, which frightened the boyars more than any army."
 ran_fox_fire_regiments: "Fox-Fire Regiments"
 desc_ran_fox_fire_regiments: "Regiments drilled to Ran's own timetable. Their reinforcements arrive on the minute, and their powder still burns a little blue."
 flavor_ran.30.t: "The First Pilgrims"
 flavor_ran.30.desc: "The shrine at Kholmogory has barely been painted, and the peasants are already coming. They walk for days along the Dvina with bread wrapped in cloth, a jar of milk, sometimes a fish. They leave it all before the golden fox carved over the door, bow three times, and walk home again.\n\nThe priests in the old church across the square are not pleased. The merchants are delighted, because pilgrims buy things. Nobody ordered these people here, and Ran, who has a formula for nearly everything, has none for this. She reads the list of offerings twice, the way she reads a ledger that refuses to balance. In the end the bread goes to the poor, and the fish goes south to Mayohiga, addressed to Chen."
 flavor_ran.30.a: "Leave the door open. Let them come."
 flavor_ran.31.t: "The Nine-Tailed Goddess"
 flavor_ran.31.desc: "It started as stories by the stove: a golden fox who counts the grain, finds lost cows and punishes greedy boyars. Then the stories got names. Then the names got icons. Now the villages around Kholmogory pray to Zlata, the Golden One, and to eight other gods whose faces look oddly familiar to anyone who has visited Gensokyo.\n\nRan wrote the whole faith down in one evening: nine gods, the feast days, which offering goes where, and a neat table of who answers which prayers. The peasants call it Nine-Tailed Shinto. The old priests call it heresy. Yukari, in a short letter, calls it 'adequate'."
 flavor_ran.31.a: "Adequate. From Yukari, that's practically a medal."
 flavor_ran.32.t: "Reunion in the North"
 flavor_ran.32.desc: "The sledge from the south arrives at dusk, and something small leaps out of it before it has stopped. Chen crosses the courtyard in four bounds, ignores three guards, two boyars and a bishop, and lands on Ran hard enough to knock her hat askew.\n\nShe has a great deal to report. Mayohiga's cats are fine. Yukari sleeps a lot. The journey was long and cold, and there was a goose. Ran hears it all out with the gravity of a state council, asks two follow-up questions about the goose, and does not let go of Chen's hand once. Behind her, all nine tails sweep the floor like a busy broom. The boyars exchange looks, and several of them decide, wisely, that they saw nothing at all."
 flavor_ran.32.a: "Welcome home, Chen. Even if home moved north."
 flavor_ran.33.t: "The Assembly of the Land"
 flavor_ran.33.desc: "For the first time, the whole realm sits under one roof: boyars in fur hats, priests of two faiths glaring at each other, and merchants counting the cost of the trip. They have come to the Zemsky Sobor to advise their sovereign. Ran has already decided everything, of course. People simply obey better when they think it was their idea.\n\nOnly one real question is left: the order of speeches. Whoever speaks first will tell the story of this day for a generation, and will expect to be rewarded for it. The other two will remember being made to wait."
 flavor_ran.33.a: "The boyars first. Swords keep the peace."
 flavor_ran.33.b: "The clergy first. Let them bless the proceedings."
 flavor_ran.33.c: "The merchants first. They're paying for the hall."
 flavor_ran.34.t: "A Boy from Kholmogory"
 flavor_ran.34.desc: "A fisherman's son from Kholmogory walked to the Academy in the middle of winter, with two borrowed books and nobody's permission. He lied about his age and his parents to get in. Then he corrected the professor of mathematics. Twice.\n\nThe Academy wanted him expelled. Ran read his notebooks instead. They cover chemistry, poetry, the northern lights and a better way to make coloured glass, all mixed together. Some of it is wrong. Most of it is wrong in interesting ways, and one page solves something Ran had been meaning to work out herself."
 flavor_ran.34.a: "Give him a desk, a salary and every book he wants."
 flavor_ran.35.t: "Candles Before the Fox"
 flavor_ran.35.desc: "A village priest has sent the bishop an alarmed letter. His parishioners have started lighting candles in front of a new icon: a golden fox with nine tails and a calm expression, hung right next to the saints. When he asked why, they explained that the saints listen on Sundays and the fox listens the rest of the week.\n\nThe bishop forwards the letter to the court and asks for guidance. Ran reads it, checks the tax records for that village, and notes that it has paid in full and on time for three years running."
 flavor_ran.35.a: "Two candles are better than one. Leave them be."
 flavor_ran.36.t: "Yukari's Gratitude"
 flavor_ran.36.desc: "The letter arrives on a pillow in the middle of Ran's desk, where there was no pillow a moment ago. It is short.\n\n\"Can you feel it, Ran? The Barrier hums. Every human out there who prays to a fox believes that youkai are real, and Gensokyo grows a little more solid each time. You did well. I'm almost proud.\"\n\nRan reads the word 'almost' several times. Then she folds the letter into a very precise square and puts it in a drawer with the others. The drawer is getting full."
 flavor_ran.36.a: "Almost proud. I'll take it."
 flavor_ran.38.t: "The Fox's Autocracy"
 flavor_ran.38.desc: "Ran runs her realm like a well-written formula. Three gauges fill on their own every month: §YSudebnik§! (administrative), §YOprichnina§! (diplomatic) and §YStreltsy§! (military). Each holds up to §Y150§!. The §YNine Governorates§! reform makes them fill §G25%§! faster, and §YThe Table of Ranks§! turns all this into §YThe Fox's Rule§!.\n\nSpend §Y100§! from a gauge to use its button:\n§YRan's Sudebnik§!: §G-10§! autonomy in every province and §G+25§! government reform progress.\n§YKitsune Oprichnina§!: §G-30§! rebel progress, §G+5%§! crown land taken from the nobility, and §R-10§! noble loyalty for 10 years. Always usable.\n§YFox-Fire Streltsy§!: the Streltsy modifier and §G+10%§! fire damage for 10 years, plus §G+0.6§! years of manpower and §G-2§! war exhaustion."
 flavor_ran.38.desc_rule: "Every servant of the fox has a rank now, and the formula has grown. Three gauges, §YAdministrative§!, §YDiplomatic§! and §YMilitary Rule§!, each hold up to §Y200§! and fill twice as fast as before (§G25%§! faster again with §YThe Nine Governorates§!). The fuller a gauge, the bigger its bonus:\n§YAdministrative§!: up to §G-15%§! development cost and §G-15%§! core-creation cost.\n§YDiplomatic§!: up to §G+2§! diplomatic reputation and §G+20%§! improve relations.\n§YMilitary§!: up to §G+1§! yearly army tradition and §G-75%§! harsh treatment cost.\n\nSpend §Y100§! from a gauge to use its button:\n§YThe Fox's Absolute Rule§!: §G-20§! autonomy in every province, every estate agenda completed, §G+25§! government reform progress.\n§YThe Golden Census§!: §G-40§! rebel progress, §G+5%§! crown land from the nobility, and for 10 years §G-15%§! state maintenance and §G+10%§! national tax.\n§YFox-Fire Regiments§!: for 10 years the Streltsy modifier, §G+10%§! fire damage and §G+20%§! reinforce speed, plus §G+1§! year of manpower and §G-4§! war exhaustion."
 flavor_ran.38.a: "Clear as a formula."
 flavor_ran.39.t: "The Gauges Carry Over"
 flavor_ran.39.desc: "Hidden event: refills The Fox's Autocracy gauges after The Table of Ranks."
 flavor_ran.39.a: "OK"
 flavor_ran.2.t: "Ran Leaves Mayohiga"
 flavor_ran.2.desc: "Hidden event: Mayohiga loses its heir (Ran) a month after she founds her own country."
 flavor_ran.2.a: "OK"
 ###COLUMN 4: THE SOUTHERN ROAD###
 RAN_kazan_title: "Take Kazan"
 RAN_kazan_desc: "The khanate on the Volga raids our villages and sells our people. Put a stop to it. Once Kazan is ours, the river carries our boats south instead of their raiders north."
 RAN_astrakhan_title: "Down the Volga to Astrakhan"
 RAN_astrakhan_desc: "Follow the river to the Caspian. Every caravan from Persia should pay us. Then the whole Volga, from forest to sea, flows through a fox's purse."
 RAN_caucasus_title: "The Caucasus"
 RAN_caucasus_desc: "Follow the Caspian shore south into the mountains. You'll find good wine, princes more stubborn than their goats, and the back door to the Sultan's house."
 RAN_crimea_title: "Break the Crimean Raiders"
 RAN_crimea_desc: "Crimea's horsemen think the steppe protects them. Show them winter does not stop at their border. For two hundred years they have raided the Rus'. End it, and the Black Sea opens."
 RAN_over_the_danube_title: "Over the Danube"
 RAN_over_the_danube_desc: "Moldavia and Wallachia are the Sultan's granaries. Take the Danube, and his Balkan armies will march on hope instead of bread. Hope, I find, is very light on the stomach."
 RAN_balkans_title: "Liberate the Balkans"
 RAN_balkans_desc: "The Slavs of the Balkans pray for a saviour. They won't expect her to have nine tails. Serbs, Bulgarians and Croats will make fine subjects, once they stop arguing with each other."
 RAN_the_archenemy_title: "The Archenemy"
 RAN_the_archenemy_desc: "The Sultan dreams of ruling everything between Vienna and Baghdad. So do I, and I had the dream first. Push our border up to his and match his army. He'll write to us. Expect rudeness."
 RAN_offer_golden_horn_title: "Yukari's Offer: Gaps in the Golden Horn"
 RAN_offer_golden_horn_desc: "The walls of Constantinople have never fallen to a frontal assault. A gap, though, is not an assault."
 RAN_ultimate_showdown_title: "The Ultimate Showdown"
 RAN_ultimate_showdown_desc: "Constantinople, the city of emperors. Take it, and the Sultan becomes a story the peasants tell about a fox. Then give it back the name the Rus' always used: Tsargrad."
 RAN_anatolia_title: "Anatolia"
 RAN_anatolia_desc: "The Sultan's heartland. Every mosque a shrine to a fox, eventually. Start with Bursa, where the first sultans lie buried."
 RAN_sultans_south_title: "The Sultan's Southern Lands"
 RAN_sultans_south_desc: "Damascus, Baghdad, Cairo. The last of the Sultan's empire and the last of his pride. Take them, and no Sultan remains, only a fox who inherited everything."
 RAN_caucasus_unlocks_central_asia_tt: "Unlocks the mission §YThe Steppe and Central Asia§!."
 RAN_archenemy_ottomans_tt: "The §YOttomans§! exist, are independent and border us, and our army is at least as strong as theirs."
 RAN_archenemy_fallback_tt: "The §YOttomans§! no longer exist or are our subject, or we already own §YConstantinople§!."
 RAN_archenemy_no_cb_tt: "We or our subjects already hold §YConstantinople§!: no Great Hunt is needed."
 RAN_golden_horn_at_war_tt: "We lead a §YGreat Hunt§! war against the holder of §YConstantinople§!."
 RAN_golden_horn_refuse_hint_tt: "Ran feeds the note to the brazier, one corner at a time, and sends the sappers back into their tunnels. Constantinople will fall to her arithmetic or not at all."
 RAN_tsargrad_decision_unlock_tt: "Unlocks the decision §YMove the Capital to Tsargrad§!."
 RAN_balkan_governors_tt: "Every province we own in the §YBalkans§! gets '§YBalkan Governors§!' for §Y25§! years: §G-1§! local unrest."
 RAN_great_church_desecrated_tt: "Our §YMuslim§! and §YOrthodox§! provinces get §R+2§! local unrest for §Y10§! years."
 RAN_great_church_orthodox_opinion_tt: "Every §YOrthodox§! country gains §G+50§! opinion of us for §Y25§! years."
 RAN_great_church_returned_tt: "Our §YOrthodox§! provinces get §G-2§! local unrest for §Y25§! years."
 RAN_mosque_left_tt: "Our §YSunni§! provinces get §G-2§! local unrest for §Y25§! years."
 cb_ran_great_hunt: "The Great Hunt"
 cb_ran_great_hunt_desc: "The Sultan dreams of an empire from Vienna to Baghdad. The fox has other plans, starting with Constantinople."
 ran_great_hunt: "The Great Hunt"
 ran_great_hunt_desc: "Take Constantinople. Every province demanded costs half the usual war score."
 RAN_GREAT_HUNT_WAR_NAME: "$ORDER$Great Hunt for $PROVINCE$"
 ran_heir_of_the_sultans_power_projection: "Heir of the Sultans §Y(Permanent)§!"
 ran_great_church_returned_opinion: "Returned the Great Church"
 ran_move_capital_to_tsargrad_title: "Move the Capital to Tsargrad"
 ran_move_capital_to_tsargrad_desc: "The city of emperors is ours. Rule from Tsargrad, where two seas and two continents meet."
 ran_volga_secured: "Volga Secured"
 desc_ran_volga_secured: "With Kazan taken, the raids along the Volga have stopped, and so has the need to guard every village."
 ran_nine_domed_cathedral: "Nine-Domed Cathedral"
 desc_ran_nine_domed_cathedral: "Nine domes, each painted a different colour, each shaped faintly like a fox's tail."
 ran_khans_treasury_taken: "The Khan's Treasury Taken"
 desc_ran_khans_treasury_taken: "The people of Kazan watched the khan's gold leave on northbound carts. They have not forgotten."
 ran_caspian_gate: "Gate of the Caspian"
 desc_ran_caspian_gate: "Persian silk, Nogai horses, salt from the steppe lakes: whatever crosses the Caspian goes up the Volga past Astrakhan. Now every bale pays the fox's toll on the way."
 ran_mountain_regiments: "Mountain Regiments"
 desc_ran_mountain_regiments: "Caucasian highlanders now march in the fox's army. They treat any slope gentler than a cliff as a road."
 ran_black_sea_access: "Black Sea Access"
 desc_ran_black_sea_access: "Our merchants sail the Black Sea from Crimea to the Bosporus, and no raider's galley comes out to meet them any more."
 ran_danubian_granaries: "Danubian Granaries"
 desc_ran_danubian_granaries: "Grain from Moldavia and Wallachia now feeds the fox's armies instead of the Sultan's."
 ran_protector_of_the_slavs: "Protector of the Slavs"
 desc_ran_protector_of_the_slavs: "From the Baltic to the Adriatic, Slavs look to the fox for protection, and send their sons to serve her."
 ran_balkan_governors: "Balkan Governors"
 desc_ran_balkan_governors: "The fox's governors rule the Balkans directly, with very thorough paperwork."
 ran_balkan_governors_province: "Balkan Governors"
 desc_ran_balkan_governors_province: "A governor appointed by the fox keeps this province in order, armed with a seal, a ledger and forty pages of Ran's instructions."
 ran_gap_in_the_walls: "Gap in the Walls"
 desc_ran_gap_in_the_walls: "A crack has opened in the walls that no sapper dug. The defenders can't explain it."
 ran_gaps_in_the_golden_horn: "Gaps in the Golden Horn"
 desc_ran_gaps_in_the_golden_horn: "Soldiers swear they see eyes staring out of the air near the walls. Morale is not what it was."
 ran_yukaris_favour_tsargrad: "Yukari's Favour"
 desc_ran_yukaris_favour_tsargrad: "Yukari keeps an eye on Tsargrad for her shikigami. Doors open more easily, and supplies arrive early."
 ran_siegecraft: "Ran's Siegecraft"
 desc_ran_siegecraft: "Ran calculates every trench and every gun position herself. The engineers have stopped arguing."
 ran_tsargrad: "Tsargrad"
 desc_ran_tsargrad: "The city of emperors, where two seas and two continents meet, now belongs to a fox."
 ran_great_shrine_of_tsargrad: "The Great Shrine of Tsargrad"
 desc_ran_great_shrine_of_tsargrad: "The greatest dome in the world now shelters a golden fox, and pilgrims come from every land we rule."
 ran_great_church_desecrated: "The Great Church Taken"
 desc_ran_great_church_desecrated: "The faithful here have not forgiven the fox for taking the Great Church of Tsargrad."
 ran_great_church_returned: "The Great Church Returned"
 desc_ran_great_church_returned: "The fox returned the Great Church of Tsargrad to the Orthodox, and the faithful remember it."
 ran_mosque_left: "The Mosque Left in Peace"
 desc_ran_mosque_left: "The fox left the mosques of Tsargrad untouched, and the faithful here are grateful."
 ran_tolerance_at_tsargrad: "Tolerance at Tsargrad"
 desc_ran_tolerance_at_tsargrad: "The fox lets every faith pray in Tsargrad, as long as the taxes are paid."
 ran_lord_of_two_seas: "Lord of Two Seas"
 desc_ran_lord_of_two_seas: "The Black Sea and the Mediterranean both answer to the fox. Every captain between Crimea and Crete knows whose flag to salute first."
 ran_heir_of_the_sultans: "Heir of the Sultans"
 desc_ran_heir_of_the_sultans: "Everything the Sultans built, from Damascus to Cairo, now runs on the fox's formulas."
 flavor_ran.40.t: "The Cathedral of the Fox"
 flavor_ran.40.desc: "Kazan has fallen. The khan's palace is empty, his vaults are full, and the people of the Volga are waiting to see what the fox will do next.\n\nYukari once told Ran a story from the Outside World: when Moscow took Kazan, the Grand Prince celebrated with a cathedral of nine domes, each painted a different colour. Ran's architects have drawn up something similar, except that the domes look faintly like fox tails. The treasurer, meanwhile, has drawn up a list of everything in the khan's vaults, and would very much like to keep it."
 flavor_ran.40.a: "Nine domes. One for each tail."
 flavor_ran.40.b: "Open the vaults. Domes don't pay soldiers."
 flavor_ran.41.t: "Liberator or Conqueror"
 flavor_ran.41.desc: "Serbian monks ring their bells as the fox's army marches past, and Bulgarian villages bring out bread and salt. They have waited a long time for someone to drive the Sultan's governors out, and they are not fussy about the number of tails.\n\nNow their elders have come to court. They ask, very politely, whether they are being liberated or simply conquered by somebody new. Ran's officials are already drafting tax rolls for the region. Her generals point out that grateful vassals also guard borders, and cost nothing to feed."
 flavor_ran.41.a: "Raise your own banners. Under ours, of course."
 flavor_ran.41.b: "Liberated, conquered: the tax rolls look the same."
 flavor_ran.42.t: "The Sultan's Insult"
 flavor_ran.42.desc: "A letter arrives from the [ran_sultan.Monarch.GetTitle] of [ran_sultan.GetName], sealed in gold and four pages long. The titles alone take a page and a half. Then it informs Ran that she is a fox, that foxes belong in henhouses, and that her lands will make a fine hunting ground for his sons.\n\nThe court waits for Ran's reaction. Ran asks for ink. Her reply, dictated in one breath, is longer, considerably ruder and grammatically flawless. Chen suggests a few additions, and most of them are accepted. The courier who carries it south rides very fast and does not look back."
 flavor_ran.42.a: "Seal it. Chen, add the paw print."
 flavor_ran.43.t: "Gaps in the Golden Horn"
 flavor_ran.43.desc: "The walls of Constantinople have stood for a thousand years. Attila turned back from them, and so did the Arabs, twice. Ran's sappers are digging, but the stones are thick and the defenders are not stupid.\n\nThis morning a pillow appeared on Ran's camp bed, with a note on it: \"The walls are very old, Ran. Old things have cracks. I could open one tonight, and nobody would ever know how. Just say yes.\""
 flavor_ran.43.desc_owned: "Tsargrad is already ours, but its walls are still being repaired and its streets still whisper about the old masters. This morning a pillow appeared on Ran's camp bed, with a note on it.\n\n\"You took the city without me. How independent of you. Still, a city like that needs watching, and I am very good at watching. Shall I keep an eye on it for you? Just say yes.\""
 flavor_ran.43.a: "As you wish, Yukari-sama."
 flavor_ran.43.b: "Thank you, but I can manage."
 flavor_ran.44.t: "The Great Church of Tsargrad"
 flavor_ran.44.desc: "For nine hundred years it was the greatest church in Christendom. For the last few generations it has been a mosque, with minarets at its corners and the old mosaics plastered over. Now it belongs to a fox, and three delegations are waiting at its doors.\n\nThe Orthodox patriarch wants his church back. The imams want their mosque left alone. Ran's own priests have already measured the dome and think it would make a magnificent shrine to the Golden One. Whatever Ran decides, somebody will be very unhappy."
 flavor_ran.44.desc_church: "For nine hundred years it has been the greatest church in Christendom, and the Sultan's armies never managed to take it. A fox did. Now three delegations are waiting at its doors.\n\nThe Orthodox patriarch wants his church kept as it is. The imams of the city's new Muslim subjects ask that their faith be left in peace. Ran's own priests have already measured the dome and think it would make a magnificent shrine to the Golden One. Whatever Ran decides, somebody will be very unhappy."
 flavor_ran.44.a: "The Golden One deserves the greatest dome in the world."
 flavor_ran.44.b: "Return it to the patriarch. Gratitude is cheap."
 flavor_ran.44.c: "Let the Sultan's old subjects keep their prayers."
 ###COLUMN 5: THE FAR EAST###
 RAN_great_perm_title: "Great Perm"
 RAN_great_perm_desc: "East of your shrine lie the Komi lands of Great Perm: salt springs, fur forests and a prince who pays tribute to whoever shouts loudest. Shout louder, Ran. The road to the Urals runs through his salt pans, and salt keeps far better than goodwill."
 RAN_stroganov_frontier_title: "The Stroganov Frontier"
 RAN_stroganov_frontier_desc: "Solvychegodsk sits on salt and fur, and its Stroganov merchants spend their evenings staring at the Urals like cats at a closed door. Make the town rich and your government modern enough to back them, then decide how wide to open that door."
 RAN_sibir_title: "Sibir"
 RAN_sibir_desc: "The khan of Sibir sits on the road to the edge of the world. Move him. Beyond the Urals the land is very big, very cold and full of fur."
 RAN_yasak_title: "Yasak: the Fur Tribute"
 RAN_yasak_desc: "The forest peoples pay their tribute in sable and fox pelts. Don't skin your own kind, Ran. Just count the others."
 RAN_to_the_pacific_title: "To the Pacific"
 RAN_to_the_pacific_desc: "Keep walking east until you reach the sea. Then plant a flag and send me a fish. No one has walked this far with nine tails before, so dress warmly."
 RAN_the_amur_title: "The Amur Question"
 RAN_the_amur_desc: "The Amur is the gate to Manchuria and the sea, and the Dragon Throne says it's theirs. Take it, or sit down with them and drink their tea. Your choice, Ran."
 RAN_ezo_title: "Ezo"
 RAN_ezo_desc: "North of Japan lies Ezo: fog, bears and Ainu fishermen. Kyoto has never much cared about it. Take it anyway. It's the stepping stone to islands where every shrine keeps a pair of stone foxes at its gate."
 RAN_offer_foxes_of_japan_title: "Yukari's Offer: The Foxes of Japan"
 RAN_offer_foxes_of_japan_desc: "In Japan, foxes are holy messengers. I could whisper to the shrines that their goddess has come from the north. Or you could walk in yourself."
 RAN_japan_subdued_title: "Japan Subdued"
 RAN_japan_subdued_desc: "Kyoto and Edo, the emperor and the shogun, both kneeling before a fox. The shrines will sing about this for a thousand years."
 RAN_central_asia_title: "The Steppe and Central Asia"
 RAN_central_asia_desc: "South of Sibir and east of the Volga, the steppe rolls on for a month's ride to Khiva, Bukhara and Samarkand, the old silk cities. Their khans trust the distance to protect them. Distance has never once stopped you."
 RAN_russian_america_title: "Across the Bering"
 RAN_russian_america_desc: "There's land beyond the sea east of Kamchatka. Cold, empty and absolutely ours. Its sea otters are worth more than gold, and nobody has noticed yet."
 RAN_fort_ross_title: "Fort Ross"
 RAN_fort_ross_desc: "A fortress on the warm California coast. Even foxes like a little sunshine. The Spanish will complain, of course. Let them complain from a distance."
 RAN_fox_trails_east_tt: "While '§YFox Trails East§!' lasts, every colony we found gets §G+1§! tax, §G+1§! production and §G+1§! manpower development."
 RAN_yasak_autonomy_tt: "At least §Y10§! provinces we own in §YSiberia§! have less than §Y50%§! autonomy."
 RAN_yasak_ducats_tt: "We collect a one-off yasak of up to §Y15§! ducats for each fur province we own."
 RAN_yasak_collection_tt: "Every fur province we own gets '§YYasak Collection§!' permanently: §G+20%§! local production efficiency."
 RAN_yasak_half_ducats_tt: "We receive §Y7.5§! ducats for each fur province we own (half the yasak)."
 RAN_yasak_full_ducats_tt: "We receive §Y15§! ducats for each fur province we own."
 RAN_red_fox_pelts_hint_tt: "Ran signs the ledger without looking up. Under her hat, her ears stay flat until the last sledge has left the yard."
 RAN_shrines_welcome_the_fox_tt: "Every province we own in §YJapan§! gets '§YThe Shrines Welcome the Fox§!' for §Y25§! years: §G-2§! local unrest, §G+2%§! local missionary strength."
 RAN_whispers_from_the_shrines_tt: "Every province in §YJapan§! that we don't own gets '§YWhispers from the Shrines§!' for §Y10§! years: §R+5§! local unrest, §R-33%§! local fort defence, §G-25%§! core-creation cost for us."
 RAN_foxes_of_japan_refuse_hint_tt: "The shrine bells begin to ring before the first boat touches the sand. Nobody whispered to these priests; they rang for the fox standing in the bow. Ran keeps that thought close all the way to Kyoto."
 cb_ran_amur_war: "The Amur War"
 cb_ran_amur_war_desc: "The Amur and the lands of Manchuria beyond it belong to the fox, whatever the Dragon Throne says."
 ran_amur_war: "The Amur War"
 ran_amur_war_desc: "Take provinces in Manchuria at reduced cost."
 RAN_AMUR_WAR_NAME: "$ORDER$Amur War"
 ran_stroganov_saltworks: "Stroganov Saltworks"
 desc_ran_stroganov_saltworks: "The salt pans of Solvychegodsk boil day and night, and the money flows east with the fur traders."
 ran_perm_salt_springs: "Perm Salt Springs"
 desc_ran_perm_salt_springs: "Brine bubbles up out of the ground here, and the boiling sheds never go cold. The salt goes west by river and comes back as silver."
 ran_stroganov_expedition: "Stroganov Expedition"
 desc_ran_stroganov_expedition: "Stroganov boats carry settlers, seed grain and one very tired priest up every river that points east."
 ran_fox_trails_east: "Fox Trails East"
 desc_ran_fox_trails_east: "Fox trails lead our settlers through the taiga. Every new colony is founded with a head start."
 ran_yasak_collection: "Yasak Collection"
 desc_ran_yasak_collection: "The forest peoples pay their tribute in furs, carefully counted by the fox's clerks."
 ran_pacific_harbour: "Pacific Harbour"
 desc_ran_pacific_harbour: "The shipyards of Okhotsk work in fog so thick the carpenters build by feel. The ships come out sound anyway, and every one of them points east."
 ran_kyakhta_trade: "Kyakhta Trade"
 desc_ran_kyakhta_trade: "At the border post of Kyakhta, fur goes south and tea comes north, and everyone gets rich."
 ran_whispers_from_the_shrines: "Whispers from the Shrines"
 desc_ran_whispers_from_the_shrines: "The priests here have been dreaming of a golden fox from the north. They have started telling the villagers about it."
 ran_foxfire_landing: "Foxfire Landing"
 desc_ran_foxfire_landing: "Ran leads the landing in Japan herself, and her soldiers would follow her into any castle."
 ran_shrines_welcome_the_fox: "The Shrines Welcome the Fox"
 desc_ran_shrines_welcome_the_fox: "The shrines of Japan ring their bells for the nine-tailed fox who came from the north."
 ran_silk_road: "Silk Road"
 desc_ran_silk_road: "The caravans of Bukhara and Samarkand travel under the fox's protection, and pay for it in silk, spices and very good melons."
 ran_russian_america: "Russian America"
 desc_ran_russian_america: "The fox's settlements have crossed the Bering Strait. The new continent is cold, wide and full of sea otters, which pleases everyone except the sea otters."
 ran_fort_ross: "Fort Ross"
 desc_ran_fort_ross: "A wooden fortress on the California coast, the southernmost outpost of the fox's realm. The garrison writes home about oranges, and nobody in Siberia believes them."
 flavor_ran.50.t: "Red Fox Pelts"
 flavor_ran.50.desc: "The first yasak caravan from the east fills the courtyard: sledge after sledge of sable, ermine and marten, counted, tagged and stacked to the rafters. The forest peoples have paid in full, and the clerks are delighted.\n\nAt the bottom of the last sledge lie the red fox pelts. Dozens of them, glossy and perfectly cured, the most valuable furs of the whole tribute. Ran stands over them for a long time without a word. The clerk who has been counting out loud all morning stops in the middle of a number, and does not start again."
 flavor_ran.50.a: "No more foxes in the yasak. Ever."
 flavor_ran.50.b: "A pelt is a pelt. Count them."
 flavor_ran.51.t: "Ran Sees the Ocean"
 flavor_ran.51.desc: "Okhotsk is a log stockade, a dozen huts and a great deal of fog. Beyond it, at last, there is nothing but grey water all the way to the horizon. Ran has walked, ridden and calculated her way across an entire continent to stand here.\n\nShe stands on the shingle until the tide wets her boots, watching the waves roll in from somewhere even further east. Then she remembers her instructions, buys the largest fish in the village, packs it in ice, and sends it west with a courier and a note: 'As requested.' The courier has six thousand miles to wonder why."
 flavor_ran.51.a: "Send it quickly. Yukari hates waiting for dinner."
 flavor_ran.52.t: "The Amur Question"
 flavor_ran.52.desc: "Our Cossacks have built a fort at Albazin, on the banks of the Amur, and the river is full of fish, furs and opportunity. Unfortunately, [ran_amur_rival.GetName] considers the Amur theirs. Their envoys have come to say so, very politely, with an army waiting behind them.\n\nRan's generals want to fight for the river and for the rich lands of Manchuria beyond it. Her merchants point out that the caravans to the south pay better than any war, and the envoys have brought tea."
 flavor_ran.52.desc_none: "Our Cossacks have built a fort at Albazin, on the banks of the Amur, and the river is full of fish, furs and opportunity. The lands of Manchuria beyond it are split between chieftains, none of them strong enough to stop us.\n\nRan's generals want to push on and claim the whole country. Her merchants would rather fix a border and open the caravan road to the south, which pays better than any war."
 flavor_ran.52.a: "The river is ours, and so is what lies beyond it."
 flavor_ran.52.b: "Fix the border. Pour the tea."
 flavor_ran.53.t: "The Foxes of Japan"
 flavor_ran.53.desc: "Across the sea from Ezo lie the islands of Japan. There, foxes are the messengers of the gods, and nearly every village has a shrine with a pair of stone foxes at its gate. Ran has read the reports with great interest, and so, it seems, has Yukari.\n\nThe note is on Ran's pillow, as usual: \"Their shrines already pray to foxes, Ran. I could whisper to the priests that their goddess is coming from the north, and the castles would open by themselves. Or you could sail over and knock on every door yourself, which sounds exhausting.\""
 flavor_ran.53.a: "Whisper to them, Yukari-sama."
 flavor_ran.53.b: "I'll knock on the doors myself."
 flavor_ran.54.t: "The Stroganov Expedition"
 flavor_ran.54.desc: "The Stroganovs have come to court with a map, a ledger and a request. Beyond the Urals, they say, there are more sables than stars, and a khan who sleeps badly. They will build the forts, pay the boatmen and hire the guides. All they want is a charter, some money and the Tsaritsa's blessing.\n\nHow far Ran backs them is up to her. A modest charter keeps the treasury calm. A grand expedition sends settlers along with the traders. Or the Stroganovs can do what they have been hinting at all morning, and hire a band of Cossacks under a man called Yermak."
 flavor_ran.54.a: "A modest charter. The merchants can carry the risk."
 flavor_ran.54.b: "Fund all of it. Boats, settlers, priests, the lot."
 flavor_ran.54.c: "Hire Yermak and his Cossacks."
 flavor_ran.55.t: "What Is Fort Ross For?"
 flavor_ran.55.desc: "The palisade at Fort Ross is finished: redwood logs, two blockhouses, a chapel and a windmill, the first one California has ever seen. The Spanish governor has sent three letters of protest. The garrison used the third to light the stove.\n\nNow the fort needs a purpose. The settlers in Alaska are hungry, and the fields around the fort grow wheat as tall as a man. But the Aleut hunters in the bay bring in sea otter pelts every week, and a single pelt sells in Kyakhta for a soldier's yearly pay. Ran can't do both properly. What is Fort Ross for?"
 flavor_ran.55.a: "Feed Alaska. Nobody hunts well on an empty stomach."
 flavor_ran.55.b: "Charter the Russian-American Company. Let the otters pay for the wheat."
 RAN_feed_alaska_tt: "Every province in §YCascadia§! and §YNorthern California§! held by us or our colonial subjects gains §G+1§! base tax and §G+1§! base production."
 ran_russian_american_company: "Russian-American Company"
 desc_ran_russian_american_company: "The company's charter covers every pelt, harbour and trading post from Kamchatka to California. Its ships sail under the fox's flag, and its ledgers are kept in Ran's own handwriting."
 ###THE FINALE###
 RAN_good_job_ran_title: "\"Good Job, Ran\""
 RAN_good_job_ran_desc: "Good job, Ran. Europe kneels, the Sultan is gone, and the Barrier hums. Everything I asked for. You can return to my side now. I'll take it from here."
 RAN_good_job_ran_effect_tt: "Yukari calls Ran home. What Ran answers is up to her, and to you."
 RAN_refuse_yukari_tt: "§RRan refuses her master.§! The disaster §YThe Shikigami Rebellion§! begins next month: §RYukari's Loyalists§! rise across the realm, with more of them where Yukari's gaps were used."
 RAN_return_vassal_tt: "We become a §Yvassal§! of §Y[ran_yukari_country.GetName]§! (freed first if it is our subject)."
 RAN_return_takeover_tt: "§YYukari§! takes Ran's place as our ruler, and we lose §R100§! prestige."
 RAN_shikigami_rebels_tt: "§RYukari's Loyalists§! rise in several of our provinces, and in up to §Y10§! provinces where Yukari's gaps were used. Yukari will send §Y3§! more hosts during the war, and sabotage us whenever she can. To win, hold out for at least §Y5§! years and destroy every loyalist army."
 RAN_gaps_open_tt: "A new army of §RYukari's Loyalists§! appears behind our lines, in a province where Yukari's gaps were used if there is one."
 RAN_whispers_from_mayohiga_tt: "Three of our areas get '§YWhispers from Mayohiga§!' for §Y5§! years: §R+3§! local unrest."
 RAN_last_spell_card_tt: "Ran is free. Her rewards follow: §YThe Formula Rewritten§! and §YGoddess of the North§!."
 RAN_ruler_six_tt: "Ran's administrative, diplomatic and military skills become §G6§!."
 RAN_golden_era_extended_tt: "Our §YGolden Era§! is extended by §G50§! years."
 RAN_golden_era_renewed_tt: "We may begin a new §YGolden Era§!."
 RAN_golden_era_available_tt: "We haven't used our §YGolden Era§! yet, and can begin it whenever we like."
 RAN_goddess_of_the_north_deity_tt: "The deity §YZlata§! gives way to §YRan, Goddess of the North§! (§G+5%§! administrative efficiency, §G+5%§! discipline). Every ruler who chose Zlata now follows the Goddess of the North."
 RAN_goddess_blessing_tt: "Every province of our faith gets '§YThe Goddess's Blessing§!' for §Y25§! years: §G-2§! local unrest."
 th_ran_civil_war: "The Shikigami Rebellion"
 th_ran_civil_war_desc: "Ran has refused her master. Yukari's Loyalists rise across the realm, and they won't stop until Ran returns to Mayohiga, or until none of them are left."
 RAN_civil_war_refused_tt: "Ran has refused to return to Yukari."
 RAN_civil_war_five_years_tt: "The rebellion has lasted at least §Y5§! years."
 RAN_civil_war_no_loyalists_tt: "No §YYukari's Loyalists§! remain in our provinces."
 th_yukari_loyalists_title: "Yukari's Loyalists"
 th_yukari_loyalists_name: "Yukari's Loyalists"
 th_yukari_loyalists_desc: "Youkai, humans and things that are neither, all loyal to Yukari Yakumo. They want the realm handed back to its true master."
 th_yukari_loyalists_army: "Loyalist Host"
 th_yukari_loyalists_demand: "Return to Mayohiga"
 th_yukari_loyalists_demand_desc: "Ran must return to Yukari's side and hand the realm over to her."
 ran_a_loyal_shikigami: "A Loyal Shikigami"
 desc_ran_a_loyal_shikigami: "Ran returned to her master when called, and the realm runs as smoothly as ever under Yukari's eye."
 ran_her_shikigamis_gift: "Her Shikigami's Gift"
 desc_ran_her_shikigamis_gift: "Ran came home and brought half the world with her. Yukari is very pleased, and only slightly smug."
 ran_chens_courage: "Chen's Courage"
 desc_ran_chens_courage: "Chen refused Yukari's call and stands by Ran. If a small cat can be that brave, the soldiers reason, so can they."
 ran_peasants_pray_to_ran: "The Peasants Pray to Ran"
 desc_ran_peasants_pray_to_ran: "In the villages, people pray for Ran by name, and send their sons to fight for her."
 ran_chen_holds_the_line: "Chen Holds the Line"
 desc_ran_chen_holds_the_line: "Chen refused to retreat, and the army was too embarrassed to leave her standing alone."
 ran_whispers_from_mayohiga: "Whispers from Mayohiga"
 desc_ran_whispers_from_mayohiga: "People here dream of a lady with a parasol, who tells them very kindly to stop obeying the fox."
 ran_unbound_shikigami: "Unbound Shikigami"
 desc_ran_unbound_shikigami: "Ran runs on a formula of her own now, shorter than Yukari's and considerably more elegant."
 ran_golden_era_of_the_fox: "Golden Era of the Fox"
 desc_ran_golden_era_of_the_fox: "The clerks call it the golden age. Ran has asked them to stop. They haven't."
 ran_living_goddess: "Living Goddess"
 desc_ran_living_goddess: "The humans' belief has made Ran a goddess, and she answers every prayer in neat handwriting."
 ran_goddess_blessing: "The Goddess's Blessing"
 desc_ran_goddess_blessing: "The Goddess of the North watches over the faithful here. Petitions left at her shrine come back answered within the week, with the spelling corrected."
 flavor_ran.60.t: "\"Good Job, Ran\""
 flavor_ran.60.desc: "The letter arrives the way they always do: on a pillow, in the middle of the throne room, where no pillow was a moment ago. The court goes quiet.\n\n\"Good job, Ran. Europe kneels, the Sultan is a story, and the Barrier has never been stronger. You can come back to my side now. I'll take it from here. Bring the realm with you, of course. It was always mine.\"\n\nRan reads it twice. The boyars watch her face and find nothing there. Chen stops swinging her legs. Somewhere in the hall, a candle burns before an icon of a golden fox."
 flavor_ran.60.desc_obedient: "The letter arrives the way they always do: on a pillow, in the middle of the throne room, where no pillow was a moment ago. The court goes quiet.\n\n\"Good job, Ran. Europe kneels, the Sultan is a story, and the Barrier has never been stronger. You can come back to my side now. I'll take it from here. Bring the realm with you, of course. It was always mine.\"\n\nRan reads it once, folds it neatly, and starts drafting the instructions for handing over the realm. It doesn't occur to her to do anything else. It never has."
 flavor_ran.60.a: "No. This realm is mine now."
 flavor_ran.60.b: "Yes, Yukari-sama. I'm coming home."
 flavor_ran.60.c: "Yes, Yukari-sama. The throne is yours."
 flavor_ran.61.t: "The Shikigami Rebels"
 flavor_ran.61.desc: "It begins at night. In a dozen provinces at once, the air splits open like a torn curtain, and soldiers step out of the gaps: youkai in old-fashioned armour, humans with blank eyes, and things that are not quite either. They carry Yukari's banner, and they all say the same thing: the fox has forgotten her place.\n\nBy morning, couriers are riding into the capital from every direction. Ran listens to each report in silence and marks every uprising on a map. Then she sends for her generals. Her formula always said this day might come. It never said who would win."
 flavor_ran.61.a: "Then I'll write the answer myself."
 flavor_ran.62.t: "Chen Stands by Ran"
 flavor_ran.62.desc: "Last night a gap opened in Chen's room, and Yukari's voice came out of it, warm and patient: Chen should come home now, there's a good girl, and leave the fox to her mistakes.\n\nChen threw a pillow at it. Then she put on her hat, found the biggest sword in the armoury, and went to stand by Ran's chair in the war council, where she has stayed ever since, glaring at anyone who looks doubtful. The generals have noticed. So have the soldiers."
 flavor_ran.62.a: "Thank you, Chen. Stay close."
 flavor_ran.63.t: "Gaps Open in the Night"
 flavor_ran.63.desc: "The sentries swear the province was quiet at midnight. By dawn, a loyalist army was camped outside the walls, cooking fires lit and tents pitched in neat rows, as if it had been there for weeks. A shepherd says a crack opened in the sky over the old road, and the soldiers marched out of it two abreast, not one of them looking the least bit surprised.\n\nRan does not need her clerks to check the old records. Wherever Yukari once lent us a hand, it seems she left the door unlocked behind her."
 flavor_ran.63.a: "Lock the doors. Then find that army."
 flavor_ran.64.t: "The Formula Falters"
 flavor_ran.64.desc: "Ran's government runs on formulas: tidy, exact, and written by Ran herself. But some of them were written long ago, on Yukari's instructions, and they have started to fail. Tax ledgers add up to the wrong totals. Orders arrive at the wrong offices. A governor in the east reports that his instructions now end with the words 'or ask Yukari'.\n\nRan could rewrite every one of them herself, line by line, in her own hand. It would take every waking hour she has, in the middle of a war. The clerks swear they can muddle through, which is exactly what worries her."
 flavor_ran.64.a: "Let the clerks muddle through."
 flavor_ran.64.b: "Rewrite every formula. Tonight."
 flavor_ran.65.t: "Youkai Desert to Yukari"
 flavor_ran.65.desc: "Not every youkai in our army was recruited by Ran. Many came because Yukari sent them, and now Yukari is calling them home. Whole companies have vanished from their camps overnight, leaving behind their boots, their debts and, in one case, a very confused horse. The ones who stayed sit around the fires and keep glancing at the sky, as if expecting a letter.\n\nThe officers say the rest can be kept, if they are paid well enough to forget whose side they were on. Youkai, the paymaster notes, have long memories, and keeping them short is expensive."
 flavor_ran.65.a: "Let them go. We'll recruit humans."
 flavor_ran.65.b: "Double their pay. Loyalty has a price."
 flavor_ran.66.t: "A Boyar's Doubt"
 flavor_ran.66.desc: "An old boyar with a beard down to his belt has started asking awkward questions at court, usually loudly and always just after dinner. If the fox can rebel against her mistress, he wonders, what exactly stops a boyar from rebelling against the fox? Nobody laughs. Several other boyars are listening very carefully, and one of them has started taking notes.\n\nIn peacetime the answer would be the Oprichnina and a long ride to a cold monastery. But in a civil war Ran needs every sword she can get, and the boyars have a great many."
 flavor_ran.66.a: "Let him talk. Words don't win wars."
 flavor_ran.66.b: "Give the boyars land. Doubt fades with acres."
 flavor_ran.67.t: "Whispers from Mayohiga"
 flavor_ran.67.desc: "In the villages, people have started dreaming about a lady with a parasol. She sits at the end of their beds, peels them an apple, and explains, very kindly, that the fox has lost her mind and that it would be best for everyone if they stopped paying their taxes. In the morning, there is apple peel on the floor.\n\nThe priests are doing what they can, which mostly means sprinkling holy water on pillows. The dreams keep coming, and the tax collectors keep coming home with empty carts and very apologetic faces."
 flavor_ran.67.a: "Tell the priests to pray louder."
 flavor_ran.68.t: "The Peasants Pray to Ran"
 flavor_ran.68.desc: "The loyalists burned a village church last week. By Sunday the peasants had rebuilt the altar from the charred beams, set an icon of a golden fox on it, and lit every candle in the parish, including the ones the priest was saving for Easter. They did not pray for victory. They prayed for Ran, by name, loudly enough to be heard in the next village.\n\nThe next village took the hint. Word has spread from parish to parish, and for once the recruiting officers report more volunteers than uniforms."
 flavor_ran.68.a: "Thank them. And order more uniforms."
 flavor_ran.69.t: "Chen Holds the Line"
 flavor_ran.69.desc: "A loyalist charge broke through our centre this morning, and for a moment the battle looked lost. Then a small figure in a green hat ran into the gap, shouted something rude about Yukari's cooking, and refused to move.\n\nThe soldiers were too embarrassed to let a cat be braver than them, so they rallied around her. The loyalists did not get through. Chen now has a bandage on one tail and is extremely proud of it."
 flavor_ran.69.a: "That's my shikigami."
 flavor_ran.70.t: "The Last Spell Card"
 flavor_ran.70.desc: "The last loyalist banner has fallen. That evening a gap opens over the capital, and Yukari steps out of it with her parasol, looking entirely unbothered. \"Shall we settle this the old way, Ran? Spell card rules. Nobody dies, and the loser accepts the result.\"\n\nThe duel lights up the sky for an hour. Border Sign \"Quadruple Barrier\" meets Shikigami \"Banquet of the Twelve General Gods\" while Chen cheers from a rooftop. For her last card, Ran uses one that was never written into her formula: Nine Tails \"Tsardom of the Fox\". The boundary gives way.\n\nYukari lowers her parasol and laughs. \"Good job, Ran.\""
 flavor_ran.70.a: "I am my own formula now."
 flavor_ran.71.t: "The Formula Rewritten"
 flavor_ran.71.desc: "For a thousand years Ran ran on a formula written by someone else. Tonight she sits down at her desk with a fresh sheet of paper and writes a new one. It is shorter than Yukari's. It is also, she notes with some satisfaction, considerably more elegant.\n\nIn the morning the court finds its sovereign changed: sharper, calmer, and somehow even harder to argue with. The clerks have started calling this the golden age. Ran has asked them to stop. They haven't."
 flavor_ran.71.a: "Back to work. There's a realm to run."
 flavor_ran.72.t: "Goddess of the North"
 flavor_ran.72.desc: "The priests were the first to notice. The prayers that used to go to Zlata, the Golden One of the peasants' stories, are now being answered by someone very real, who reads every petition and replies in neat handwriting.\n\nBelief has made the messenger a goddess. Across the realm, the icons of the golden fox are repainted overnight: the hat is gone, fox ears stand where it used to be, and a halo of gold shines behind them. Nobody admits to having done it."
 flavor_ran.72.a: "I suppose I'd better answer them, then."
 flavor_ran.73.t: "Back to Mayohiga"
 flavor_ran.73.desc: "The loyalists hold the capital. Ran's last army has laid down its arms, and Ran sits alone in the throne room, waiting, her hands folded in her sleeves.\n\nYukari arrives through a gap, sits down opposite her and pours two cups of tea. \"You fought well, Ran. Better than I taught you, actually. But it's over now.\" The realm passes under the rule of [ran_yukari_country.GetName], and Ran goes home to Mayohiga, where, it turns out, nobody has done the dishes in years."
 flavor_ran.73.desc_takeover: "The loyalists hold the capital. Ran's last army has laid down its arms, and Ran sits alone in the throne room, waiting, her hands folded in her sleeves.\n\nYukari arrives through a gap, sits down opposite her and pours two cups of tea. \"You fought well, Ran. Better than I taught you, actually. But it's over now.\" Yukari takes the throne herself, and Ran goes back to what she always was: a very capable shikigami, standing one step behind her master."
 flavor_ran.73.a: "Yes, Yukari-sama."
 flavor_ran.74.t: "The Last Spell Card"
 flavor_ran.74.desc: "Yukari has gone through a gap to settle matters with her shikigami in person: a danmaku duel over the fox's capital, spell card rules, and the loser accepts the result.\n\nShe came back an hour later with a scorched parasol and an expression nobody at court dared to ask about. When someone finally did, she said only \"Good job, Ran,\" and went back to sleep."
 flavor_ran.74.a: "They grow up so fast."
 flavor_ran.79.t: "Civil War Barrage"
 flavor_ran.79.desc: "Hidden event: picks a civil-war event."
 flavor_ran.79.a: "OK"
 RAN_loyalist_wave_tt: "A fresh host of §RYukari's Loyalists§! comes through the gaps: one main army and two lesser bands. How strong the main army is depends on Ran's resolve."
 flavor_ran.75.t: "Reinforcements from Mayohiga"
 flavor_ran.75.desc: "For a year and a half the loyalists have been losing ground, and Ran had begun to hope that Yukari was bored of the whole affair. She was not.\n\nLast night a gap the size of a city gate opened over the steppe, and a fresh army marched out of it in perfect order: banners dry, boots clean, as if it had stepped out of a barracks next door. In a sense, it had. The scouts report that this host is better armed than the last. Ran reads the report, notes the numbers, and adjusts her formula. Yukari always did like to test her."
 flavor_ran.75.a: "Then we pass this test as well."
 flavor_ran.76.t: "The Gaps Widen"
 flavor_ran.76.desc: "Halfway through the war, the gaps have stopped closing. They hang open in the sky over our provinces like torn sails, and through them Yukari sends another host, larger and angrier than anything the loyalists have fielded in a year.\n\nThe peasants have taken to hanging garlic over their doors, which does nothing against youkai but makes them feel better. Ran's generals ask for more men. Ran gives them more men, and a revised timetable."
 flavor_ran.76.a: "March. We end this on my schedule."
 flavor_ran.77.t: "Yukari's Last Host"
 flavor_ran.77.desc: "The war is nearly won, and Yukari knows it. This time she doesn't send youkai of the second rank. Her last host comes through the gaps led by veterans of a hundred incidents, in good order, and it marches straight for the heart of the realm.\n\nRan watches it come from the walls, counting banners out of habit. One more battle, perhaps two, and it will be over, one way or the other. By any sensible formula, this is the moment for fear. Instead, to the alarm of her generals, Ran catches herself humming."
 flavor_ran.77.a: "One last battle. Then I'm free."
 RAN_forged_letters_tt: "Every neighbour and ally gets '§YRude Letters from the Fox§!': §R-50§! opinion of us, fading over §Y5§! years."
 ran_forged_letters: "Rude Letters from the Fox"
 ran_gap_in_the_treasury: "A Gap in the Treasury"
 desc_ran_gap_in_the_treasury: "A guard sits on the gap in the treasury vault. The coins still slip away, just more slowly."
 ran_gaps_in_the_walls: "Gaps in the Walls"
 desc_ran_gaps_in_the_walls: "Yukari keeps opening gaps in our fortress walls. The masons keep patching them. The masons are losing."
 ran_supplies_spirited_away: "Supplies Spirited Away"
 desc_ran_supplies_spirited_away: "Wagons, boots and powder keep vanishing into gaps on the road. The army is learning to share."
 flavor_ran.80.t: "A Gap in the Treasury"
 flavor_ran.80.desc: "The treasurer came to Ran this morning as pale as a ghost, which in this court is saying something. Overnight a gap opened in the floor of the treasury vault and swallowed a good part of the gold. In its place lay a neat receipt, signed with a little parasol: 'Borrowed for safekeeping.'\n\nThe gap is still there, quietly eating coins. A guard can sit on it and slow it down. Or Ran can seal it with a barrier of her own, if she can spare the time to write one."
 flavor_ran.80.a: "Put a guard on it. A heavy one."
 flavor_ran.80.b: "I'll write the barrier myself. Bring ink."
 flavor_ran.81.t: "Gaps in the Walls"
 flavor_ran.81.desc: "Our fortresses were built to keep armies out. They were not built to keep out a youkai who can open a door wherever she likes. All along the frontier, garrisons wake up to find new gaps in their walls: neat slits with a ribbon tied at each end, just wide enough for a regiment. One commander insisted the gap had always been there. That commander now guards a quieter fort.\n\nThe masons can patch the stone, but Yukari will simply open new gaps. Only wards will hold, and warding every wall means pulling soldiers off the drill fields."
 flavor_ran.81.a: "Patch the stone and hope she gets bored."
 flavor_ran.81.b: "Ward every wall. The drills can wait."
 flavor_ran.82.t: "Supplies Spirited Away"
 flavor_ran.82.desc: "The quartermasters have lost the war's supplies. Not to bandits, and not to rot, but to the road itself: whole wagon trains roll into a gap and never come out the other side. Last week an entire depot of boots disappeared, and the army is now marching on goodwill and blisters.\n\nThe merchants will happily sell us everything again, at war prices. Or the army can make do, and the generals can explain to the soldiers why dinner is late."
 flavor_ran.82.a: "Make do. Hunger builds character."
 flavor_ran.82.b: "Buy it all again, at war prices."
 flavor_ran.82.c: "Send Chen after the wagons. Buy whatever she can't find."
 flavor_ran.83.t: "Letters Ran Never Wrote"
 flavor_ran.83.desc: "Foreign courts have started receiving letters from Ran. They are beautifully written, perfectly sealed, and extremely rude. One tells a neighbouring ruler that their crown looks borrowed. Another informs an ally that our alliance was 'a clerical error'. Ran wrote none of them, but the handwriting is hers to the last stroke, and only one person alive has had a thousand years to practise copying it.\n\nOur envoys could ride to every court that matters and apologise in person. It is a lot of riding, and even more apologising."
 flavor_ran.83.a: "My true friends will know it wasn't me."
 flavor_ran.83.b: "Send envoys. And apologies. And better letters."
 ###RAN RECURRING EVENTS: LETTERS FROM MAYOHIGA, CHEN'S MISCHIEF, THE FALSE FOX###
 ran_yukaris_favour: "Yukari's Favour"
 desc_ran_yukaris_favour: "Yukari is pleased with her shikigami. Abroad, awkward questions about our borders have a way of being forgotten."
 ran_veterans_of_the_barrier: "Veterans of the Barrier"
 desc_ran_veterans_of_the_barrier: "Our soldiers stood watch on the border of Gensokyo. After that, an ordinary battlefield holds few surprises."
 ran_copied_law_codes: "Copied Law Codes"
 desc_ran_copied_law_codes: "Our jurists came back from Yukari's errand with law codes from a library that is on no map. Half of them are about magic. The other half settle a land dispute faster than anything in our own books."
 ran_copied_treaties: "Copied Treaties"
 desc_ran_copied_treaties: "The translators copied old treaties in languages nobody here speaks. Our envoys quote them at foreign courts now, and no ambassador will admit he has never heard of them."
 ran_copied_siege_manuals: "Copied Siege Manuals"
 desc_ran_copied_siege_manuals: "The engineers brought back manuals on cannons, on walls, and on bringing walls down. Some pages are singed at the edges. Nobody will say why."
 ran_the_fox_is_away: "The Fox Is Away"
 desc_ran_the_fox_is_away: "Ran is at Mayohiga doing the housework. The governors are arguing about who is in charge."
 ran_chen_sulking: "Chen Is Sulking"
 desc_ran_chen_sulking: "Chen has been scolded, and she wants everyone to know it. She sits behind the stove with her back to the room and won't come out for envoys, boyars or fish."
 ran_kremlin_cats: "The Kremlin Cats"
 desc_ran_kremlin_cats: "Chen's cats keep the granaries free of rats. In return they get the best cushions, the warmest stoves and, on feast days, the throne."
 ran_two_foxes: "Two Foxes"
 desc_ran_two_foxes: "Half the villages pay their taxes to the other fox. The other half are waiting to see who wins. The boyars keep two portraits ready to hang."
 RAN_fox_is_away_tt: "In a year Ran comes home: §G+1§! stability (or §G50§! administrative power if stability is already 3) and '§YYukari's Favour§!' for §Y5§! years."
 RAN_chen_sent_to_mayohiga_tt: "Chen spends a year at Mayohiga. No Chen's Mischief until she's back."
 RAN_false_fox_rumours_tt: "'§YTwo Foxes§!' lasts until the False Fox is unmasked. Sooner or later, she will rise."
 RAN_false_fox_field_tt: "The §RFalse Fox§! rises at full strength: a large army in [ran_false_fox_home.GetName] and §Y2–4§! more in our provinces nearby, more if our realm is large. Beating it this way also gives §G+10§! army tradition and §G+25§! prestige."
 RAN_false_fox_smaller_tt: "The §RFalse Fox§! rises with fewer followers: an army in [ran_false_fox_home.GetName] and §Y1–3§! smaller ones nearby."
 RAN_false_fox_stakes_tt: "Destroy all her armies and take back every province she holds to unmask her. If her rebels win instead: §R-2§! stability and §R-100§! prestige."
 th_false_fox_rebels_title: "The False Fox"
 th_false_fox_rebels_name: "Followers of the False Fox"
 th_false_fox_rebels_desc: "Peasants, runaway serfs and bored youkai who follow a pretender with a golden fox's tail. She says she is the true fox, and Ran a servant who climbed too high."
 th_false_fox_rebels_army: "Host of the False Fox"
 th_false_fox_rebels_demand: "Crown the True Fox"
 th_false_fox_rebels_demand_desc: "Ran must bow to the pretender. We lose §R2§! stability and §R100§! prestige."
 flavor_ran.85.t: "Pocket Money for Mayohiga"
 flavor_ran.85.desc: "A letter has arrived from Mayohiga, on scented paper and in very elegant handwriting. Yukari writes that she has run a little short of money, again, and is sure her dear shikigami will understand. She does not say what the money is for. Last time it was 'barrier maintenance'. The time before that, it turned out to be a great deal of sake for Suika.\n\nThe sum she names is exactly half of what our realm earns in a year. Yukari always did know our books better than our treasurer."
 flavor_ran.85.a: "Send it. A happy Yukari is a quiet Yukari."
 flavor_ran.85.b: "Our treasury needs it more than her sake cellar."
 flavor_ran.86.t: "Guards for the Barrier"
 flavor_ran.86.desc: "In her latest letter, Yukari writes that something has been testing the Great Hakurei Barrier: knocking on it at night, like a guest who wasn't invited. Reimu is 'looking into it', which means she is asleep at the shrine. Yukari would like soldiers to stand watch on the border of Gensokyo. She would prefer soldiers she doesn't have to feed herself.\n\nThe letter asks for half a year's worth of our new recruits. They will come back, Yukari promises, older, wiser, and very tired of the view."
 flavor_ran.86.a: "Send the men. Veterans are made on borders."
 flavor_ran.86.b: "Our own borders need them. Wake Reimu up."
 flavor_ran.87.t: "Books for the Gap"
 flavor_ran.87.desc: "Yukari's newest letter asks for scholars. She wants them sent through a gap to copy some books for her. She won't say which books. She only mentions that their owner never leaves her library and will hardly notice a few quiet visitors. The work, she writes, is 'educational, for everyone involved'.\n\nThe academies grumble, but every scholar who comes back from one of Yukari's errands is worth three who stayed at home. The more our realm already knows, the more scholars she asks for."
 flavor_ran.87.a: "Send the jurists. They could use a holiday."
 flavor_ran.87.b: "Send the translators. Someone has to read the footnotes."
 flavor_ran.87.c: "Send the engineers. Books on cannons, please."
 flavor_ran.87.d: "Our academies need every scholar they have."
 flavor_ran.88.t: "Housework at Mayohiga"
 flavor_ran.88.desc: "This letter is short. Yukari has woken from her winter sleep and found Mayohiga in a state. The dishes haven't been done since autumn. The cats have taken over the kitchen. Somewhere under the laundry, the barrier needs mending. She expects Ran home to cook, clean and fix it all, 'just for a little while'.\n\nWith Yukari, a little while is never little, and without Ran the government will drift. But a shikigami who keeps Mayohiga tidy is a shikigami Yukari remembers fondly."
 flavor_ran.88.a: "Pack my apron. The realm can run itself for a year."
 flavor_ran.88.b: "Send Chen instead. She knows where the cats are."
 flavor_ran.88.c: "Pretend the letter got lost on the way."
 flavor_ran.89.t: "The Fox Comes Home"
 flavor_ran.89.desc: "Ran is back from Mayohiga, smelling faintly of soap and woodsmoke. The dishes are done, the cats are evicted, and the barrier is mended. Yukari, Ran reports, said 'thank you' once, which is once more than usual, and then went back to sleep.\n\nThe court is relieved, and nobody more than the governors, who have spent a year arguing over who was in charge and have the bruised pride to prove it. Ran settles every argument before lunch, and by dinner the realm is running as if she had never left."
 flavor_ran.89.a: "Where was I? Ah, yes. Everything."
 flavor_ran.90.t: "A Cat in the Duma"
 flavor_ran.90.desc: "The Boyar Duma was in the middle of a very serious debate about grain taxes when a boyar's prize cat ran across the table, followed closely by Chen. Inkwells went flying. Two boyars dived under the table. One very old boyar had to be helped down from the curtains.\n\nChen caught the cat, held it up proudly, and asked whether she was in trouble. The whole Duma is waiting to hear Ran's answer, and so is the cat."
 flavor_ran.90.a: "Chen! Apologise to the boyars. Now."
 flavor_ran.90.b: "Let them laugh. The debate was boring anyway."
 flavor_ran.90.c: "Pay for the curtains. And the inkwells."
 flavor_ran.91.t: "Lost in the Moscow Markets"
 flavor_ran.91.desc: "Chen went to the Moscow markets this morning to buy fish, and she hasn't come back. Since then the city guard has had reports of a girl with two tails in the fish row, in the fur row, on the roof of a church, and asleep in a basket of mittens. Wherever she has been, something is missing. Mostly fish.\n\nThe guard finally brings her home at dusk, full and very pleased with herself. An hour later the merchants' bill arrives. It is three pages long, and someone has drawn a cat on the back."
 flavor_ran.91.a: "No more markets without an escort."
 flavor_ran.91.b: "Thank the merchants. Moscow has a good heart."
 flavor_ran.91.c: "Pay the bill. All three pages of it."
 flavor_ran.92.t: "Chen Falls into the Neva"
 flavor_ran.92.desc: "Chen was chasing a gull along the Neva embankment when the embankment ended and the river began. She came out a minute later, soaked to both tails and in a very bad mood. Worse, as every youkai knows, Chen's shikigami washes off when she gets wet, and Ran now has to write the whole formula again from scratch.\n\nThe whole city watched. Some of them are still laughing. Chen, wrapped in three blankets, says the gull started it."
 flavor_ran.92.a: "Write it again. And stay away from rivers."
 flavor_ran.92.b: "Let them laugh. A cheerful city is a loyal one."
 flavor_ran.92.c: "Write it properly this time. Make it waterproof."
 flavor_ran.97.t: "The Ambassador's Lapdog"
 flavor_ran.97.desc: "The [ran_lapdog_envoy.GetAdjective] envoy arrived in [Root.Capital.GetName] this morning with letters, gifts and a small, very proud lapdog. By noon the lapdog had barked at Chen. By ten past noon it was running through the throne room with Chen right behind it: past the guards, under the table laid for the feast, and up a tapestry older than the realm.\n\nThe dog is unhurt. It is now hiding in the envoy's hat, and the envoy is still wearing the hat. Chen says the dog started it. The envoy is waiting for an apology."
 flavor_ran.97.a: "Chen. Apologise to the envoy. And to the dog."
 flavor_ran.97.b: "Let Chen apologise herself. How bad could it be?"
 flavor_ran.97.c: "Send the envoy home with gifts. Expensive ones."
 flavor_ran.97.d: "The dog started it. Everyone heard it bark."
 flavor_ran.98.t: "A Kremlin Full of Cats"
 flavor_ran.98.desc: "Chen has made friends with every stray cat in [Root.Capital.GetName], and this morning she invited them all home. There are cats in the throne room, cats in the chancery, and a ginger tom asleep on the seal of state. The cooks report that there isn't a single rat left in the granaries. The boyars report that there isn't a single dry cushion left in the Duma.\n\nChen has already given every cat a name and a job. She would like to know which of them can stay."
 flavor_ran.98.a: "Every cat goes back to the street. Today."
 flavor_ran.98.b: "They can stay. The granaries have never been cleaner."
 flavor_ran.98.c: "Find each of them a good home. We'll pay."
 flavor_ran.84.t: "I Told You Not to Spoil Her"
 flavor_ran.84.desc: "A letter from Mayohiga, and for once Yukari isn't asking for anything. Somehow she has heard about every one of Chen's adventures in the north, including the ones the court swore never to mention. She would like to remind Ran, very gently, that when she sent Chen north her only advice was five words long, and the first two were 'try not'.\n\nShe offers to come north and help. The letter smells faintly of sake. At the bottom is a small drawing of a cat sitting on a throne, which is either a warning or a joke."
 flavor_ran.84.a: "You're right. I've been far too soft on her."
 flavor_ran.84.b: "Then come and teach her yourself."
 flavor_ran.84.c: "She is my shikigami. I'll raise her my way."
 RAN_chen_scolded_tt: "Chen is no longer spoiled (§Y0§! of §Y3§!)."
 RAN_chen_spoiled_1_tt: "Chen gets a little spoiled (§Y1§! of §Y3§!). At §Y2§!, her mischief comes more often and gets bigger."
 RAN_chen_spoiled_2_tt: "Chen gets more spoiled (§Y2§! of §Y3§!). From now on her mischief comes every §Y10§! years instead of §Y15§!, and it gets bigger. Scolding her undoes this."
 RAN_chen_spoiled_3_tt: "Chen is now fully spoiled (§Y3§! of §Y3§!). Her mischief keeps coming every §Y10§! years, and it stays big."
 RAN_chen_spoiled_letter_tt: "Yukari will hear about this."
 RAN_chen_spoiled_max_tt: "Chen is already as spoiled as she can get (§Y3§! of §Y3§!). Her mischief keeps coming every §Y10§! years."
 RAN_chen_stays_spoiled_tt: "Chen stays fully spoiled (§Y3§! of §Y3§!). Her mischief keeps coming every §Y10§! years, and it stays big."
 RAN_chen_duma_laughs_tt: "The Duma laughs with her. Even the old boyar from the curtains manages a smile."
 RAN_chen_duma_walks_out_tt: "The old boyar from the curtains walks out, and half the Duma follows him."
 RAN_chen_market_laughs_tt: "The merchants laugh and tear up the bill. One of them sends Chen a fish."
 RAN_chen_market_angry_tt: "The merchants don't laugh. By evening every guild hall in Moscow is talking about the bill."
 RAN_chen_neva_laughs_tt: "The city laughs with her. By spring the gull is painted on a tavern sign."
 RAN_chen_neva_mocked_tt: "The city laughs at her, and then at Ran. The taverns on the Neva have a new song."
 RAN_chen_waterproof_tt: "Chen's new formula is waterproof: '§YChen Falls into the Neva§!' never happens again. She still hates baths."
 RAN_chen_lapdog_charms_tt: "Chen bows, apologises to the dog first, and offers it half her fish. The envoy laughs and writes home about it."
 RAN_chen_lapdog_bites_tt: "The apology goes well until the dog barks again. Nobody is sure who Chen meant to bite, but it was the envoy's hand."
 RAN_chen_cats_behave_tt: "The cats behave. Foreign visitors are told they are an old northern custom."
 RAN_chen_cats_throne_tt: "During an audience with a foreign envoy, a cat falls asleep on the throne. Ran has to stand."
 RAN_yukari_teaches_chen_good_tt: "Chen behaves perfectly for the whole visit. Yukari says she is impressed, and almost sounds like she means it."
 RAN_yukari_teaches_chen_bad_tt: "Yukari spends the visit teaching Chen to open small gaps. For weeks nobody in the palace can find their shoes."
 ran_chen_charmed_envoy: "Charmed by Chen"
 ran_chen_bit_envoy: "Chen Bit Our Envoy"
 ran_dog_started_it: "'The Dog Started It'"
 flavor_ran.93.t: "The False Fox: Rumours"
 flavor_ran.93.desc: "Strange news is coming up the river roads from [ran_false_fox_home.GetName]. A woman with a golden fox's tail has appeared there. She calls herself Lisa Patrikeevna, the true fox of the old tales, and says the fox in the capital is only a servant who climbed too high. Some peasants say she has nine tails. Others say one tail and a very good tailor.\n\nEither way, the story travels faster than our couriers. Villages are holding back their taxes 'until it's clear which fox is real', and the boyars have started keeping two portraits, just in case. In the tales, Lisa Patrikeevna was a trickster. This one is recruiting."
 flavor_ran.93.a: "Watch her. Quietly, for now."
 flavor_ran.94.t: "The False Fox Marches"
 flavor_ran.94.desc: "The rumours have grown an army. Lisa Patrikeevna has raised her banner in [ran_false_fox_home.GetName], and peasants, runaway serfs and bored youkai are flocking to it from half a dozen provinces. Ran has read her proclamations. The grammar is excellent. The claims are outrageous.\n\nThere is no talking her down now. She has a tail, a crown of her own and a following that grows every week. She will have to be beaten in the field. The only question is how big her army is when the fighting starts."
 flavor_ran.94.a: "Let her come. I'll meet her in the field."
 flavor_ran.94.b: "Pay the boyars to stay home."
 flavor_ran.94.c: "Turn her captains before they march."
 flavor_ran.95.t: "The False Fox Unmasked"
 flavor_ran.95.desc_crushed: "The pretender's army is broken. In the last camp, Ran's soldiers found her tent empty, except for a single leaf on her pillow. That evening a short woman with round glasses and a big striped tail walked into the throne room as if she owned it.\n\n'Mamizou Futatsuiwa,' she said with a bow. 'Tanuki. Lisa was me. I wanted to see how the famous fox handles a rival. Rather well, it turns out.' She leaned over Ran's desk, flicked through the treasury ledgers and tutted. 'Your clerks are skimming, and badly. Hire me, and it will stop.'"
 flavor_ran.95.desc_won: "Lisa Patrikeevna's rebels won, and for one strange week the realm had two foxes. On the eighth day she called the whole court together, took off her golden tail, and put on a pair of round glasses. Under the tail was a big striped one. 'Mamizou Futatsuiwa,' she said. 'Tanuki. I only wanted to see how the famous fox handles a rival. Badly, it turns out.' Then she handed back the crown and walked out.\n\nThe court will be talking about this for years, and none of it kindly."
 flavor_ran.95.a: "A tanuki on the council. Count the spoons."
 flavor_ran.95.b: "No one speaks of this week. Ever."
 flavor_ran.96.t: "The False Fox Watch"
 flavor_ran.96.desc: "Hidden event: checks whether the False Fox's rebels are gone."
 flavor_ran.96.a: "OK"
 flavor_ran.99.t: "Letters and Mischief"
 flavor_ran.99.desc: "Hidden event: sends a Letter from Mayohiga or Chen's Mischief."
 flavor_ran.99.a: "OK"
