 ###TRADE GOODS###
 strawberry: "Strawberries"
 strawberryDESC: "Strawberries are cultivated worldwide and appreciated due to their bright red color and overall sweetness. In gensokyo it became a delicacy once it was discovered, particularly among the fairies who happened to adore the fruit."
 sake: "Sake"
 sakeDESC: "Sake is an alcoholic beverage that originated in japan. However it found a lot of fame and usuage in gensokyo, as it became a festival special, ceremonies and to some; a habit."
 custard: "Custard"
 custardDESC: "Don't mind me, just sitting here waiting for flan to come out!"
 cucumber: "Cucumbers"
 cucumberDESC: "Cucumbers are creeping plants that are widely cultivated due to its edible fruit. It originated from india and somehow, Kappas are the only Gensokyans who got hold of the vegetable."  
 magic_flowers: "Magical Sunflowers"
 magic_flowersDESC: "The main Source of power of Yuuka Kazami and the field itself. The flowers grant the holder immense power! As long as Yuuka herself controls the magical flowers she will gain more power than usual."
 miasma: "Miasma"
 miasmaDESC: "The toxins that makai relies on and use to keep outsiders and enemies at bay. It stuns individuals and provides a seamlessly impenetrable defense for the areas which it covers."
 magical_artifacts: "Magical Artifacts"
 magical_artifactsDESC: "Gensokyo is a magical land, and as such, the existence of magical items and trinkets isn't surprising. However, with the border messed up; Magical items have spread into the outworld! Albeit rare to find, these items promise a lot of value to their owner." 
 magic_tomes: "Magical Tomes"
 magic_tomesDESC: "Magical Tomes that are also scattered because of border instability. They are quite powerful in the wrong hands! For now however,only the witches of Gensokyo possess the books, and they're working on collecting the scattered pages throughout the world."
 fumos: "Fumos"
 fumosDESC: "Fumos are a line of high-quality plush character figures manufactured and sold by magician merchants. They possess magical qualities which make them ideal trinkets for everyone who is in dire need of a companion.\n\n§TFumos can only be produced in provinces that have a §YFumo Manufactory§! present."
 lamprey: "Lamprey"
 lampreyDESC: "Since the Middle Ages, lamprey has been revered as a high-class delicacy, prepared in a myriad of ways. In Gensokyo, the grilled lamprey sold by the Night Sparrow youkai is immensely popular, with a reputation for particularly improving one's eyesight."
 shrimp: "Shrimp"
 shrimpDESC: "Across East and West alike, shrimp has long delighted the palates of many. Large varieties are prized for their thick, succulent meat in tempuras, grills, and stews, while smaller ones are stir-fried whole or used to enrich the flavor of broths."
 potato: "Potatoes"
 potatoDESC: "A starchy Tuber native to the Americas, however due to time travel shenanigans can also be found in Gensokyo. A hardy vegetable with a good shelflife, it has become a staple food for many."
 truffle: "Truffle"
 truffleDESC: "Truffle has been recognized since antiquity as one of the rarest and most precious ingredients, famous for the traditional harvesting method of using trained pigs to sniff out their scent."
 honey: "Honey"
 honeyDESC: "Produced by bees from the nectar of flowers, honey has been harvested by humanity for millennia through both wild foraging and beekeeping. Highly valued for its sweetness and preservative qualities, it has served as a vital alternative to sugar in many regions."
 tofu: "Tofu"
 tofuDESC: "Made from ground and curdled soybeans, tofu became a staple side dish across various East Asian nations, beginning with medieval China."
 fig: "Fig"
 figDESC: "Mainly cultivated in the Mediterranean and the Middle East, fig was a familiar staple for local peoples and frequently served as a powerful metaphor within Christian tradition."
 radish: "Radish"
 radishDESC: "A versatile and popular vegetable, the radish is utilized in various dishes from its thick root to its leafy greens. In East Asia, its abundance and ease of cultivation made it a crucial emergency ration for armies throughout history."
 lunar_herb: "Lunar Herb"
 lunar_herbDESC: "A general term for various medicinal herbs and plants that grow on the Moon. Pure and untouched by the defilement of the Earth or the breath of death, these lunar flora serve as invaluable materials for numerous applications across both realms."
 udambara: "Udambara"
 udambaraDESC: "Originally a plant of the Lunar Capital, the Udambara thrives by using the impurities of the Earth as its nourishment. The Lunar Princess, Kaguya Houraisan, brought this plant with her when she was exiled to the Earth, and even named her pet moon rabbit after it."
 snow_fungus: "Snow Fungus"
 snow_fungusDESC: "A mushroom that grows primarily in frigid regions where the snow never ceases. Having stored nutrients from the soil to survive the cold, it is highly valued as a precious food source in frozen lands."
 ghost_steel: "Ghost Steel"
 ghost_steelDESC: "A metal infused with the spiritual power of ghosts and phantoms. Carrying the essence of the dead, weapons forged from this steel can inflict effective damage even against spiritual entities such as souls and youkai."
 onmyou_metal: "Onmyou Metal"
 onmyou_metalDESC: "A metal crafted by processing \"Izanagi Objects\"—materials from an ancient era when matter belonged to no one. Possessing a strength akin to the divine, it is the same material used to craft the Yin-Yang Orbs wielded by the Hakurei Shrine Maiden."
 amethysts: "Amethysts"
 amethystsDESC: "A purple gemstone regarded as a precious jewel in pre-modern times due to its color and rarity. In Ancient Greece, it was believed that drinking from an amethyst cup would protect one from drunkenness."
 diamond: "Diamond"
 diamondDESC: "Long recognized as the king of gems for its brilliant luster and a hardness surpassing any other substance on Earth. However, its high value and rarity have often incited sacrifice and conflict during its mining and distribution."
 necrotic_bones: "Necrotic Bones"
 necrotic_bonesDESC: "The skeletal remains of creatures with evil auras, such as beasts, youkai, and demons. While the malevolent energy of their former owners still lingers within, they are exceptionally sturdy and resistant to decay, making them excellent materials if handled correctly."
 grimoires: "Grimoires"
 grimoiresDESC: "Books containing the research of renowned mages, offering information far more useful than standard magical texts. Rumor has it that there is even a grimoire penned by a girl with psychic powers from the Outside World."
 demon_books: "Demon Books"
 demon_booksDESC: "Books containing information regarding the demons residing in Hell and Makai. Those with sufficient knowledge and magical power can use these books to summon familiars."
 law_books: "Law Books"
 law_booksDESC: "As the number of souls facing judgment in Higan continues to rise, yamas constantly compile law books that organize statutes and various precedents."
 scrolls: "Scrolls"
 scrollsDESC: "Paper inscribed with various magical knowledge and incantations. They are used in the creation of magic tomes and serve as essential materials for Spell Cards."
 goheis: "Goheis"
 goheisDESC: "Ritual tools used by shrine maidens and priests in Shinto. There is a persistent rumor that the Gohei used by the Hakurei Shrine Maiden grows longer as time passes."
 talismans: "Talismans"
 talismansDESC: "Paper charms inscribed with divine patterns or scripts, used in Eastern religions such as Buddhism, Taoism, and Shinto. They are generally used to call upon the power of deities and spirits to exorcise evil entities."
 trinkets: "Trinkets"
 trinketsDESC: "Accessories such as earrings, bracelets, and rings have been symbols for flaunting the owner's wealth and power since antiquity. Being small and portable, they were also used as protective charms by imbuing them with magical or spiritual energy."
 keystones: "Keystones"
 keystonesDESC: "A specialty of the Heavens, originally used to be driven into the earth to prevent earthquakes. However, by leveraging this property, one can also manipulate the tremors of the sea or simply drop them on enemies to inflict fatal blows."
 machinary: "Machinary"
 machinaryDESC: "A general term for miscellaneous metal devices such as gears, screws, and springs used as materials for machines. Skilled Kappa and human engineers can craft cutting-edge equipment from mere scraps of machinery."
 dolls: "Dolls"
 dollsDESC: "Stuffed models made in the likeness of humans. Mages who specialize in puppetry have dedicated much effort to making these dolls move like people, or even effort to creating autonomous dolls that move of their own accord."
 masks: "Masks"
 masksDESC: "Decorative items worn over the face to portray various expressions. They have long been used in religious rituals and theater to amplify and display the wearer's role or emotions."
 onbashira: "Onbashira"
 onbashiraDESC: "Pillars created only in certain regions among Japanese shrines, said to be carved from sacred trees. Shrines regularly hold ceremonies to replace these pillars to gather faith and assert the presence of their gods and maidens."
 haniwa: "Haniwa"
 haniwaDESC: "Grave goods buried alongside the deceased in ancient Japan. Crafted in human likeness, they are highly useful for tasks requiring labor or in combat."
 higanbana: "Higanbana"
 higanbanaDESC: "Also known as the Red Spider Lily, this flower is famous in the East for its associations with death due to its blood-red color and lethal toxicity. However, it was also being used for medicine and emergency food serves as a vital aid in avoiding death's grasp."
 peaches: "Peaches"
 peachesDESC: "The fruit of the peach tree is beloved for its juiciness and sweet aroma. In the East, legends speak of celestial peaches consumed by the hermits, granted the power to bestow longevity for thousands of years."
 moon_sake: "Moon Sake"
 moon_sakeDESC: "Brewed with lunar technology, this sake is used in the festivals and rituals of the Moon. Its exquisite aroma and flavor are so highly regarded that even the youkai of the Earth are known to steal it in secret."
 potions: "Potions"
 potionsDESC: "Prepared with various medicinal ingredients and incantations, these potions are remedies for wounds. Whether applied topically or consumed, they allow for the rapid recovery of physical damage."
 lotus: "Lotus"
 lotusDESC: "Native to India, the lotus is commonly found in the mud of ponds and marshes. Because it blooms beautifully even in the mire, it has been regarded as a sacred flower by most Eastern religions, including Hinduism, Buddhism, Taoism, and Confucianism."
 dreammushroom: "Dream Mushroom"
 dreammushroomDESC: "Found mainly in the Forest of Magic, this mushroom is imbued with powerful mana. When brewed correctly, it can be refined into magical potions capable of inducing potent hallucinations and hypnotic effects."
 magic_lumber: "Magic Lumber"
 magic_lumberDESC: "Wood cut from trees that have heavily concentrated the forest's mana. Lighter yet sturdier than ordinary timber, it serves as a highly useful construction material."
 soultrout: "Soultrout"
 soultroutDESC: "A fish found primarily in the Netherworld or Higan, having accumulated spiritual power by feeding on the essence of souls that have fallen into the Sanzu River or the streams of Netherworld."
 bamboo: "Bamboo"
 bambooDESC: "A plant of temperate regions utilized for a vast array of purposes, from construction and furniture to musical instruments and weaponry. Gensokyo, in particular, is home to a massive bamboo forest where even youkai lose their way; the bamboo here boasts a vitality far superior to that of the Outside World."
 soulsand: "Soulsand"
 soulsandDESC: "Soil formed by the accumulation of soul fragments over vast periods of time. Perhaps due to the grudges of souls that failed to enter the cycle of reincarnation, explorers have reported the sensation of their ankles being grabbed when traversing such terrain."
 spiritsalt: "Spirit Salt"
 spiritsaltDESC: "Salt produced from soul spirit-infused rocks or coastal seawater. Aside from its saltiness, it differs little from ordinary salt."
 enchanted_water: "Enchanted Water"
 enchanted_waterDESC: "Water sourced only from certain areas in Gensokyo where mana pools. It tastes better than ordinary water and is indispensable for brewing sake and magical potions."
 ginkgo_nuts: "Ginkgo Nuts"
 ginkgo_nutsDESC: "Seeds of the ginkgo tree are used as an ingredient after removing their pungent outer layer. Ginkgo tree itself is prized in architecture, furniture-making, and landscaping for its sturdy wood and beautiful foliage."
 oni_beans: "Oni Beans"
 oni_beansDESC: "While Japanese tradition dictates the throwing of beans during Setsubun to drive away Oni, in truth, these legumes are far from being a significant weakness for the Oni themselves."
 liquid_blight: "Liquid Blight"
 liquid_blightDESC: "A liquid substance created by concentrating all manner of ill omens, such as disease, curses, and miasma, delivering fatal damage to invaders."
 ever_ice: "Everice"
 ever_iceDESC: "Ice hardened by mana, characterized by its inability to melt under normal temperature changes. It is used in the construction of formidable fortresses."
 obsidian: "Obsidian"
 obsidianDESC: "Obsidian is a naturally occurring volcanic glass. It is hard and brittle, and fractures with sharp edged. It can be used to manufacture cutting and piercing tools."
 lunagems: "Lunagems"
 lunagemsDESC: "A general term for precious metals refined with lunar technology. They possess a unique, ethereal beauty not found on the Earth."
 enchanted_quicksilver: "Enchanted Quicksilver"
 enchanted_quicksilverDESC: "A peculiar mercury unique to Gensokyo, its exterior is sealed with powerful mana to prevent the leakage of its toxic components."
 moonstone: "Moonstone"
 moonstoneDESC: "Tastes like cheese... but crunchy."
 runecloth: "Runecloth"
 runeclothDESC: "Fabric inscribed with various types of incantations and magic. Those who wield supernatural powers, such as youkai, shrine maidens, and magicians, wear garments crafted from this material."
 hell_essence: "Hell Essence"
 hell_essenceDESC: "A substance formed by compressing the aura and mana of Hell into mineral form. Its striking crimson color, reminiscent of blood and lava, evokes the common imagery of the underworld."
 medicine: "Medicine"
 medicineDESC: "Substances which promote healing, often ingested or otherwise consumed. In the Bamboo Forest of the Lost, it is said that more advanced applications are known..."
 astral_dust: "Astral Dust"
 astral_dustDESC: "Powders of substances from space. Due to it's inherent instability, it's primarily found in areas where the borders between worlds have blurred.\nIt lacks much use, however for some who are magically inclined it has been found to act as a subtle performance enhancing substance when properly prepared."
 star_ember: "Star Ember"
 star_emberDESC: "Crystals which have been infused with magical fire. Without proper preparation for use, the surrounding environment can become cursed. However, this does make shards of Star Ember valuable in manufacturing bullets."
