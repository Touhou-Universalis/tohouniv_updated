 ###NINE-TAILED SHINTO (RAN)###
 th_ninetailedshinto: "Nine-Tailed Shinto"
 th_ninetailedshinto_religion_desc: "Nine-Tailed Shinto began as stories told by the stove about a clever golden fox, and somehow grew a priesthood. Its shrines honour the old Slavic gods by their old names. If those gods now look a lot like the residents of a certain hidden land in the east, the faithful are too polite to say so.\nEach ruler picks a patron from the pantheon, and the faith may keep a syncretic religion alongside it."
 th_harmonized_ninetailed_shinto: "Harmonized with Nine-Tailed Shinto"
 desc_th_harmonized_ninetailed_shinto: "We have taken Nine-Tailed Shinto into our national faith. Fox shrines stand beside our own temples now, and nobody minds the bread left out for them."
 ###DEITIES###
 th_ran_perun: "Perun"
 th_ran_perun_desc: "God of thunder and war, and chief of the old gods. His new icons show a tall woman with a great ring of sacred rope on her back and a pillar in each hand, which the old songs never mentioned. Warriors pray to her anyway. She seems to enjoy it."
 th_ran_veles: "Veles"
 th_ran_veles_desc: "God of cattle, wealth and the underworld, and the trickiest of the old gods. These days Veles lends money at fair rates, wears round spectacles and has a big bushy tail that the priests leave out of the sermons."
 th_ran_mokosh: "Mokosh"
 th_ran_mokosh_desc: "Mother of the damp earth and keeper of the harvest. Her new icons show a cheerful girl in a hat hung with grapes, and the faithful swear her shrines smell faintly of baked sweet potatoes."
 th_ran_svarog: "Svarog"
 th_ran_svarog_desc: "The heavenly smith, who forged the sun and taught people to work iron. Lately the smith seems to have taken up jewellery: every village forge now hangs a string of bright stone beads over the anvil, for luck."
 th_ran_stribog: "Stribog"
 th_ran_stribog_desc: "Grandfather of the winds, who sends storms against enemy fleets and fair weather to his own. Sailors say his messengers have black wings, fly faster than any gale, and always want an interview for some newspaper."
 th_ran_dazhbog: "Dazhbog"
 th_ran_dazhbog_desc: "The sun god, giver of wealth and of the right to rule. His priests now teach that the sun lives inside a cheerful girl with raven wings, who carries it everywhere and should be kept well away from the granaries."
 th_ran_morana: "Morana"
 th_ran_morana_desc: "Goddess of winter and death, whose straw figure is drowned in the river every spring. She has never held it against anyone. Invaders who march in January find her very good company, and very hard to leave."
 th_ran_kot_bayun: "Bayun"
 th_ran_kot_bayun_desc: "Kot Bayun, the great cat of the fairy tales, whose stories put travellers to sleep. In this telling the cat is small, has two tails, hates baths, and comes running the moment Lady Ran calls."
 th_ran_devyatikhvostaya: "Zlata"
 th_ran_devyatikhvostaya_desc: "Zlata, \"the Golden One\", also called Devyatikhvostaya, \"the Nine-Tailed One\". The peasants of the north tell of a golden fox who keeps the tax books, settles their quarrels and answers prayers within the week. Nobody remembers her from the old songs. Nobody seems to mind."
 th_ran_goddess_of_the_north: "Ran"
 th_ran_goddess_of_the_north_desc: "Ran, Goddess of the North. Belief made the messenger a goddess. Ran no longer runs on anyone else's formula, and the whole North now prays to her by her real name."
 ###REBELS###
 th_ninetailed_rebels_title: "Religious"
 th_ninetailed_rebels_name: "$RELIGION$ Zealots"
 th_ninetailed_rebels_desc: "Religious fanatics tend to rise up in provinces controlled by nations of a different faith. They seek to spread their faith and smite all unbelievers."
 th_ninetailed_rebels_army: "$RELIGION$ Army"
 th_ninetailed_rebels_demand: "Convert $COUNTRYNAME$"
 th_ninetailed_rebels_demand_desc: "The religious rebels fight for the $RELIGION$ religion. They demand that we recognize its supremacy or at the very least cease our efforts to convert them and let them worship in peace."
 ###DEITY EVENTS### (events/TouhouShintoDeities.txt)
 th_deity_events.62.t: "Pillars Overnight"
 th_deity_events.62.desc: "The garrison woke this morning to find two enormous wooden pillars standing in the drill yard. Nobody heard them arrive. Each one is thicker than a church door and wrapped in a straw rope as thick as a man's arm.\n\nThe priests of Perun say this is how the Thunderer shows favour. The sergeants say nothing, because the recruits have started drilling twice as hard without being told. One of them swears he saw a tall woman sitting on top of the left pillar at dawn, looking very pleased with herself."
 th_deity_events.62.a: "Leave the pillars. The recruits clearly like them."
 th_deity_events.63.t: "A Priestess Who Fights"
 th_deity_events.63.desc: "A young priestess of Perun walked into our war camp today with a ring of sacred rope on her back and asked for a command. The officers laughed until she lifted a supply cart over her head to make her point.\n\nShe says Perun told her in a dream that this war is 'a festival, and festivals need a good show'. The soldiers would follow her anywhere. The question is where to put her: at the head of a regiment, or at the drums, leading the war songs that keep the whole army marching."
 th_deity_events.63.a: "Give her a regiment and a horse."
 th_deity_events.63.b: "Let her lead the war songs."
 th_deity_events.64.t: "Faith Is a Business"
 th_deity_events.64.desc: "The high priest of Perun arrived at court with a chest of silver and a very short speech. The Thunderer, he said, has been counting the prayers of [Root.GetName] and finds them 'excellent value'. The silver is her payment, with a note asking us to keep up the good work.\n\nThe treasurer has never been paid by a god before and is not sure which ledger to use. The old priests mutter that the old Perun never paid anyone anything. The new one seems to think faith is a trade like any other."
 th_deity_events.64.a: "Into the treasury, before she changes her mind."
 th_deity_events.65.t: "The White Snake"
 th_deity_events.65.desc: "A white snake has curled up on the altar of Perun's great temple and refuses to leave. It is as long as a boat and eats only the best offerings. It watches visitors with the calm of something that has never once been told no.\n\nThe priests are sure it belongs to the god. Soldiers have started to visit it before they march, and they come back oddly cheerful. The bishop would like it gone, gently, before it notices his cat."
 th_deity_events.65.a: "It's Perun's snake. Feed it the good bread."
 th_deity_events.65.b: "Carry it out. Carefully. Very carefully."
 th_deity_events.66.t: "Leaves for Coins"
 th_deity_events.66.desc: "A merchant in a straw hat and round spectacles paid for a whole warehouse of furs in gold this week. By the next morning the coins had turned into oak leaves. Before the guards could start a hunt, the merchant came back, apologised for 'a small accounting mistake' and paid again: twice the price, in real silver.\n\nThe priests of Veles say the god of wealth enjoys a joke but always settles his debts. The furriers want to know whether to expect more customers like this."
 th_deity_events.66.a: "Keep the silver. Burn the leaves."
 th_deity_events.66.b: "Hire this merchant to trade for us."
 th_deity_events.67.t: "Two Rulers at Court"
 th_deity_events.67.desc: "For one whole morning, [Root.GetName] had two rulers. Both sat on the throne, both signed decrees, and both insisted the other was a fake. The real [Root.Monarch.GetName] was only identified when the other one sneezed. A big bushy tail popped out from under the robe, and the impostor ran off laughing.\n\nThe priests of Veles call it a lesson from the god of tricks. Our spymasters call it the best disguise they have ever seen, and they would very much like to learn how it was done."
 th_deity_events.67.a: "Find whoever taught that. Quietly."
 th_deity_events.68.t: "The Market under the Bridge"
 th_deity_events.68.desc: "A night market has started to meet under the great bridge of [Root.Capital.GetName]. It opens at dusk and closes at first light. The traders are short, cheerful and very hairy, and they sell everything from rice wine to foreign maps at prices nobody can beat.\n\nThe priests of Veles bless the market every evening, which the regular merchants find suspicious. The customs officers would like to know how the goods get under the bridge without passing a single one of their posts."
 th_deity_events.68.a: "Let them trade. Our merchants can learn something."
 th_deity_events.68.b: "Send our envoys to haggle with them."
 th_deity_events.69.t: "The Kettle That Never Empties"
 th_deity_events.69.desc: "A monastery in our lands owns an old iron kettle that a pilgrim left behind years ago. This spring the monks noticed that it never runs out of tea. They have poured from it for three months, and it is still full and still hot. On quiet nights, the novices say, it grows a tail and walks around the kitchen.\n\nPilgrims now come from all over the realm to drink from it. The priests of Veles call it a gift from the god. The abbot says it is a very good kettle and he would like to keep it."
 th_deity_events.69.a: "Let the pilgrims come. Every cup is a prayer."
 th_deity_events.70.t: "Sweet Potatoes in the North"
 th_deity_events.70.desc: "A new root has started to grow in our fields. It is purple outside, gold inside and sweet when baked, and it grows where even rye struggles. The peasants say Mokosh brought it herself: a cheerful girl in a hat hung with grapes walked through the villages last autumn, handing it out from a basket.\n\nEvery shrine of Mokosh now smells of baked sweet potatoes. The question is what to do with the harvest: plant more of it around the capital, or pack it up as rations for the army."
 th_deity_events.70.a: "Plant it around the capital."
 th_deity_events.70.b: "Pack it for the soldiers."
 th_deity_events.71.t: "The Harvest Festival"
 th_deity_events.71.desc: "This year's harvest festival was the biggest anyone can remember. Every village made a straw doll of Mokosh with a grape-hung hat, and every village insisted that theirs looked the most like her. Somewhere in the crowd a girl in red went from table to table, tasting every pie and judging each one very seriously.\n\nThe festival ended with a feast in the capital. Nobody went hungry and nobody started a fight, which the court considers a small miracle in itself."
 th_deity_events.71.a: "A good harvest makes a happy realm."
 th_deity_events.72.t: "Two Sisters in the Song"
 th_deity_events.72.desc: "The harvest songs of Mokosh have gained a new verse. It is about her older sister, a quiet goddess who paints the autumn leaves red and gold and then sits and watches them fall. Nobody knows where the verse came from. The singers just know it now.\n\nThe priests are divided. Some want to build small shrines to the sister as well, so that the leaves are painted properly and the harvest stays good. Others say one harvest goddess is plenty, and the money should go to the scribes instead."
 th_deity_events.72.a: "Honour both sisters."
 th_deity_events.72.b: "One goddess is plenty. Pay the scribes."
 th_deity_events.73.t: "A Year of Plenty"
 th_deity_events.73.desc: "The grain is growing thicker than anyone has ever seen. The stalks bend under the weight, the mills cannot keep up, and the farmers have run out of places to store it all. The priests of Mokosh say the goddess is having a very good year. Several farmers say they saw her lying in a wheat field, eating a sweet potato and humming.\n\nThe extra harvest will pay for new mills and new markets in every grain-growing province of the realm."
 th_deity_events.73.a: "Build more mills!"
 th_deity_events.74.t: "Beads over the Anvil"
 th_deity_events.74.desc: "Every forge in [Root.GetName] now hangs a string of bright stone beads over the anvil. The smiths say Svarog asked for it. The bead-maker who brings them is a cheerful young woman who never charges a coin and always asks to see the cannon moulds.\n\nSince the beads went up, our foundries have cast cannons faster and cheaper than ever, and not one has burst. The master gunners have started to hang beads on the guns as well, just in case."
 th_deity_events.74.a: "Beads on every cannon."
 th_deity_events.75.t: "A Jewel for the Crown"
 th_deity_events.75.desc: "A smith from the provinces arrived at court with a gift for the regalia: a curved green stone bead, polished so finely that it glows in candlelight. He says Svarog's apprentice made it 'between two other jobs'. The court jewellers studied it for an hour and then quietly put away their own tools.\n\nThe bead now hangs from the crown of [Root.GetName]. Foreign envoys keep staring at it, and [Root.Monarch.GetName] has started to stand wherever the light catches it best."
 th_deity_events.75.a: "Wear it to every audience."
 th_deity_events.76.t: "The Smith's Apprentices"
 th_deity_events.76.desc: "A crowd of young apprentices has turned up at the great forge of [Root.Capital.GetName]. They say Svarog sent them to learn, and each one wears a single stone bead on a cord. They work fast, they work well, and they argue about stonework late into the night.\n\nThe master smith would like to put them to use. He could send them to repair our fortress walls, which are old and expensive to keep. Or they could stay at the forge and make weapons for the army."
 th_deity_events.76.a: "Send them to fix the walls."
 th_deity_events.76.b: "Keep them at the forge."
 th_deity_events.77.t: "Svarog's Workshop"
 th_deity_events.77.desc: "Overnight, a new workshop has opened by the river in [Root.Capital.GetName]. Nobody built it, and nobody remembers the plot ever being empty. Inside, the anvils are warm, the tools are sorted by size, and a string of stone beads hangs over every workbench.\n\nThe local craftsmen moved in by noon, and by evening they had made more than in the whole of last week. The priests of Svarog say the god has opened a workshop in our capital and asks only that we keep it tidy."
 th_deity_events.77.a: "Keep it tidy. Very tidy."
 th_deity_events.78.t: "An Interview with the Wind"
 th_deity_events.78.desc: "A reporter with black wings landed in the throne room this morning, opened a notebook and asked [Root.Monarch.GetName] forty questions in ten minutes. She says she writes for Stribog's own newspaper and that 'the readers want to know everything'. The guards tried to catch her and gave up after the third gust.\n\nThe interview will be printed and carried to every court by the wind. We can answer every question and see what the world makes of us, or say very little and spend the afternoon writing to our envoys instead."
 th_deity_events.78.a: "Answer everything. Smile for her drawing."
 th_deity_events.78.b: "No comment. Write to our envoys instead."
 th_deity_events.79.t: "Fair Winds"
 th_deity_events.79.desc: "For months now, every ship flying our flag has had the wind behind it. Merchant captains report crossings in half the usual time. Storms open around our convoys and close again behind them. One sailor swears that a girl with black wings flew beside his ship for a whole day, taking notes.\n\nThe priests of Stribog say the grandfather of the winds is pleased with us. The merchant guilds suggest we keep him that way."
 th_deity_events.79.a: "Fill the sails. Make some money."
 th_deity_events.80.t: "The Storm"
 th_deity_events.80.desc: "The enemy fleet put to sea this week with the wind behind them. By evening the wind had turned. By the next morning it was a storm that followed their ships and nobody else's. Our sailors watched it from the harbour and did not even get wet.\n\nThe priests of Stribog have already written a hymn about it. A newspaper nobody ordered has already printed the whole story, with drawings. Our admirals have started to plan their battles with the weather in mind."
 th_deity_events.80.a: "Stribog sails with us!"
 th_deity_events.81.t: "Foreign Newspapers"
 th_deity_events.81.desc: "A great gust of wind dropped a stack of newspapers into the palace courtyard. They come from every court in the world, in a dozen languages, and every one has the same name printed at the top. They report the private business of foreign kings in alarming detail. Some of it is even true.\n\nOur chancellery wants to make use of them. We could take on another envoy to read them properly, or read them ourselves tonight for a few useful secrets."
 th_deity_events.81.a: "Take on another envoy to read them."
 th_deity_events.81.b: "Read them ourselves. Tonight."
 th_deity_events.82.t: "The Sun Comes Down"
 th_deity_events.82.desc: "Peasants in the fields saw the sun come down to earth this week. It turned out to be a cheerful girl with raven wings and something very bright in her chest. She waved to everyone, said the harvest looked lovely, and flew off again. It has been the hottest summer anyone can remember.\n\nThe crops are ripening twice as fast. One granary caught fire when she flew over it. The priests ask whether we should thank the sun with a feast, or politely ask her to keep away from the granaries."
 th_deity_events.82.a: "Thank the sun. The harvest is worth one granary."
 th_deity_events.82.b: "Ask her nicely to fly higher next time."
 th_deity_events.83.t: "Two Suns in the Sky"
 th_deity_events.83.desc: "For one afternoon there were two suns over [Root.Capital.GetName]. The second one moved around a lot and seemed to be having a wonderful time. Then it flew away to the west, and the sky went back to normal.\n\nThe priests of Dazhbog announced that this was a sign: the sun god himself had come down to look at [Root.Monarch.GetName], and approved. The people believed it at once. Nobody wants to argue with the god of sunlight in a summer this hot."
 th_deity_events.83.a: "Of course the sun approves of us."
 th_deity_events.84.t: "Sunlit Forges"
 th_deity_events.84.desc: "The forges of [Root.GetName] have not needed charcoal for a month. Every morning the fires light themselves and burn hotter than ever. The smiths say a girl with raven wings visits at dawn, puts her hand on each furnace, says 'There you go!' and flies off.\n\nThe workshops are making more than ever before. A few smiths have lost their eyebrows, but they all agree it was a fair price."
 th_deity_events.84.a: "Work while the fires burn."
 th_deity_events.85.t: "A Temple for the Sun"
 th_deity_events.85.desc: "The priests of Dazhbog have brought a request from the god. The sun would like a temple in the capital: large, made of stone, with a very high roof 'so she doesn't bump her head'. In return, the priests promise warm winters and full markets around the temple for as long as it stands.\n\nIt will be expensive. The treasurer would rather we explain to the sun that the budget is tight this year and give the money to the clerks instead."
 th_deity_events.85.a: "Build it. Make the roof extra high."
 th_deity_events.85.b: "The budget is tight. The clerks get the money."
 th_deity_events.86.t: "An Early Winter"
 th_deity_events.86.desc: "Winter came a full month early this year, and it seems to have come only for our enemies. Their camps are buried in snow and their horses are freezing. Our own soldiers are warm and confused. A sentry reports that a large, friendly woman in white spent the night in the enemy camp, telling everyone how lovely the weather was.\n\nThe priests of Morana say the goddess of winter is fighting on our side. The generals agree, and would like her to stay a while."
 th_deity_events.86.a: "Let it snow on them."
 th_deity_events.87.t: "The Straw Figure Comes Back"
 th_deity_events.87.desc: "At the spring festival the people of [Root.Capital.GetName] dressed up the straw figure of Morana and threw it into the river, as they do every year to send the winter away. This year the figure walked back out of the water. It shook itself dry, laughed, thanked everyone for the lovely swim and walked off north.\n\nThe priests say this is a very good sign: winter likes us. The people are not sure what to think, but it was the best-attended festival in years."
 th_deity_events.87.a: "Next year we throw two of them."
 th_deity_events.88.t: "Hard Winters, Hard Men"
 th_deity_events.88.desc: "The winters in our lands have been hard for years, and our soldiers have become very good at them. They march through snow, sleep in it and fight in it, and they barely notice the cold. The recruiting officers say every young man in the villages wants to join up, because the army is the one place where the cold is a joke.\n\nThe priests of Morana say the goddess of winter has hardened our people. The generals would like to put them to use."
 th_deity_events.88.a: "Raise more regiments."
 th_deity_events.89.t: "The Winter That Stays"
 th_deity_events.89.desc: "It is the middle of May and it is still snowing. The rivers are frozen and the fields are white. The priests of Morana say the goddess of winter has simply decided that she likes it here. A big woman in white was seen having a snowball fight with the village children.\n\nThe army thinks this is excellent training. The farmers think it is a disaster. The priests say she might leave if asked nicely, but she will expect gifts, and the gifts will need a great deal of paperwork."
 th_deity_events.89.a: "March through it. It builds character."
 th_deity_events.89.b: "Ask her nicely, with all the proper forms."
 th_deity_events.90.t: "The Cat's Lullaby"
 th_deity_events.90.desc: "A small cat with two tails has been seen in the villages where the grumbling is loudest. Each night it sits by a fire and tells a story. Nobody remembers the story the next morning, and nobody quite remembers why they were angry either. Several troublemakers have gone back to their farms.\n\nThe priests say Bayun, the great storyteller cat, is singing our troubles to sleep. The tax collectors are just glad they can visit the villages again."
 th_deity_events.90.a: "Leave out a bowl of milk for Bayun."
 th_deity_events.91.t: "Cats in Every Granary"
 th_deity_events.91.desc: "The granaries of [Root.GetName] used to lose a quarter of their grain to mice. Then the cats came. Every granary now has at least one, and they all answer to the priests of Bayun. The mice are gone. The cats sleep on the grain sacks all day and only get up when somebody important visits.\n\nOne cat with two tails seems to be in charge of them all. She inspects a different granary every day and leaves muddy paw prints on the ledgers."
 th_deity_events.91.a: "Give the cats an official salary."
 th_deity_events.92.t: "Bayun Will Not Be Washed"
 th_deity_events.92.desc: "On the day of the spring cleaning, the priests of Bayun tried to wash the great wooden statue of the cat in their temple. They scrubbed it all afternoon. The next morning the statue was perfectly dry, the soap was gone, and every bucket in the yard had been tipped over.\n\nThe priests tried again, and the same thing happened. Now the whole city is talking about the cat who hates baths. The court scholars have written the miracle down and want to study it."
 th_deity_events.92.a: "Bayun doesn't want a bath. Respect that."
 th_deity_events.93.t: "A Cat on the Throne"
 th_deity_events.93.desc: "During an audience with foreign envoys, a small cat with two tails walked into the throne room, climbed up beside [Root.Monarch.GetName] and fell asleep. The envoys were charmed. One of them, a very stiff old ambassador, asked if he might pet it, and was allowed to.\n\nThe envoys have written home about the friendly court of [Root.GetName]. Our chancellery would like to build on this. The cat would like a cushion."
 th_deity_events.93.a: "Give the cat a cushion and a seat at the table."
 th_deity_events.93.b: "Write to their courts while they still smile."
 th_deity_events.94.t: "The Fox Balances the Books"
 th_deity_events.94.desc: "The treasury of [Root.GetName] has not balanced in years. This week it balanced to the last coin. The clerks found every ledger corrected overnight in neat golden ink, with each stolen coin marked, each mistake fixed, and a short note at the bottom of the last page: 'Please remember to carry the one.'\n\nThe priests of Zlata say the Golden One keeps the books of everyone who prays to her. Several officials have already resigned and moved to distant estates."
 th_deity_events.94.a: "Catch the ones who ran. Thank the fox."
 th_deity_events.95.t: "Prayers Answered Within the Week"
 th_deity_events.95.desc: "A widow in the north prayed to Zlata to find her lost cow. Three days later the cow came home, washed and fed, with a neat note tied to one horn. A miller prayed for his broken wheel, and by Friday it was mended. The priests have written down more than two hundred stories like these this year alone.\n\nThe people say the Golden One answers every prayer within the week and is never late. They have started to say the same about the government of [Root.Monarch.GetName]."
 th_deity_events.95.a: "We shall try to be as prompt."
 th_deity_events.96.t: "Tea with the Goddess"
 th_deity_events.96.desc: "The priest of a small northern village swears that a golden fox came to his door last week, sat down for tea and asked about the harvest, the taxes and the state of the roads. She took careful notes, thanked him and left. Since then his sermons have become clearer and his parish has doubled.\n\nThe church wants to bring this priest to the capital as a teacher. He would prefer to stay in his village and keep the kettle hot, in case she comes back."
 th_deity_events.96.a: "Bring him to court. He asks only half pay."
 th_deity_events.96.b: "Leave him his kettle. Copy his notes."
 th_deity_events.97.t: "A Formula on the Church Wall"
 th_deity_events.97.desc: "A long formula appeared overnight on the wall of the great church in [Root.Capital.GetName], written in golden chalk. It covers the whole wall. Nobody can read it, but the court mathematicians have stared at it for weeks, and they say it explains everything from the harvest to the tax rolls.\n\nThe priests of Zlata say the Golden One writes down how the world works, for anyone patient enough to follow it. Our clerks have started to use bits of it at work, with startling results."
 th_deity_events.97.a: "Copy it down before someone cleans the wall."
 th_deity_events.73.tt: "Every province we own that produces §YGrain§! gains §G+1§! base production."
 ###DEITY EVENT MODIFIERS###
 th_deity_perun_thunder: "Perun's Thunder"
 desc_th_deity_perun_thunder: "A priestess with a ring of sacred rope on her back leads our war songs. The army charges as if the sky were behind it."
 th_deity_perun_serpent: "Perun's Serpent"
 desc_th_deity_perun_serpent: "A white snake lives on Perun's altar. Our soldiers visit it before every campaign and come back strangely confident."
 th_deity_veles_ledger: "Veles's Merchant"
 desc_th_deity_veles_ledger: "A merchant in round spectacles trades for us now. The coins are always real. Usually."
 th_deity_veles_masks: "Veles's Masks"
 desc_th_deity_veles_masks: "Our spies have learned a few tricks from the god of disguise. None of them have grown a tail yet."
 th_deity_veles_night_market: "The Night Market"
 desc_th_deity_veles_night_market: "Short, hairy traders sell anything under the bridge from dusk to dawn, and our merchants buy and sell with them."
 th_deity_mokosh_potato_rations: "Sweet Potato Rations"
 desc_th_deity_mokosh_potato_rations: "Our soldiers carry baked sweet potatoes on the march. They stay warm, and so do the soldiers."
 th_deity_mokosh_two_sisters: "Both Harvest Sisters"
 desc_th_deity_mokosh_two_sisters: "We honour the harvest goddess and her quiet sister who paints the leaves. The harvest has never been better."
 th_deity_svarog_cannons: "Svarog's Cannons"
 desc_th_deity_svarog_cannons: "Bright stone beads hang over every anvil and every gun. Our cannons come out faster, cheaper and straighter."
 th_deity_svarog_walls: "Svarog's Masons"
 desc_th_deity_svarog_walls: "The god's bead-wearing apprentices keep our fortress walls in repair, and they argue about every stone."
 th_deity_svarog_workshop: "Svarog's Workshop"
 desc_th_deity_svarog_workshop: "A workshop that nobody built stands by the river. The anvils are always warm and the tools always sorted."
 th_deity_stribog_winds: "Stribog's Winds"
 desc_th_deity_stribog_winds: "Every ship under our flag sails with the wind behind it. A black-winged girl sometimes flies alongside, taking notes."
 th_deity_stribog_newspapers: "Foreign Newspapers"
 desc_th_deity_stribog_newspapers: "An envoy reads the newspapers the wind brings us. Our diplomats always know the latest gossip of every court."
 th_deity_dazhbog_sunlit_forges: "Sunlit Forges"
 desc_th_deity_dazhbog_sunlit_forges: "Our forge fires light themselves every morning and burn hotter than coal ever could. Mind your eyebrows."
 th_deity_morana_deep_snow: "Deep Snow"
 desc_th_deity_morana_deep_snow: "Winter has come early, and only for our enemies. They freeze outside our walls while we stay warm inside them."
 th_deity_morana_hard_winters: "Hard Winters"
 desc_th_deity_morana_hard_winters: "Our people grew up in hard winters. Our soldiers march through snow and treat the cold as a joke."
 th_deity_bayun_granary_cats: "Granary Cats"
 desc_th_deity_bayun_granary_cats: "Salaried cats guard every granary. The mice are gone, and the ledgers have muddy paw prints on them."
 th_deity_bayun_charm: "The Court Cat"
 desc_th_deity_bayun_charm: "A two-tailed cat sleeps on a cushion at our audiences. Foreign envoys like us a great deal more for it."
 th_deity_zlata_formula: "Zlata's Formula"
 desc_th_deity_zlata_formula: "Our clerks work from a golden formula copied off a church wall. Nobody understands it, but it works."
 ###CHOOSE PERSONAL DEITY### (decisions/TH_Religion.txt, events/TouhouShintoEvents.txt: TH_shinto_events.10 from the decision, .11 by itself every 10 years)
 th_ninetailed_deity_decision_title: "Choose Personal Deity"
 th_ninetailed_deity_decision_desc: "The old gods of the north have many faces, and a few of them are new. Our priests say any of them will answer if asked politely and offered something good. A ruler may change patrons once in a generation, and nobody will think less of them for it."
 TH_shinto_events.10.t: "A New Patron"
 TH_shinto_events.10.desc: "Every ten years or so, the priests set out the icons of the gods in the great hall, side by side: Perun with her pillars, Veles with his round spectacles, Mokosh with her grapes, and all the rest. In front of each icon stands a small offering bowl. [Root.Monarch.GetName] is to drop one coin into one bowl, and that god will be the patron of the realm.\n\nThe priests insist the gods are not jealous of each other. A small cat with two tails has curled up in Bayun's bowl, which some of them feel is cheating."
 TH_shinto_events.10.a: "Perun, the Thunderer, shall be our patron."
 TH_shinto_events.10.b: "Veles, the Trickster, shall be our patron."
 TH_shinto_events.10.c: "Mokosh, Mother of the Harvest, shall be our patron."
 TH_shinto_events.10.d: "Svarog, the Heavenly Smith, shall be our patron."
 TH_shinto_events.10.e: "Stribog, Grandfather of the Winds, shall be our patron."
 TH_shinto_events.10.f: "Dazhbog, the Sun, shall be our patron."
 TH_shinto_events.10.g: "Morana, Lady of Winter, shall be our patron."
 TH_shinto_events.10.h: "Bayun, the Storyteller Cat, shall be our patron."
 TH_shinto_events.10.i: "Zlata, the Golden One, shall be our patron."
 TH_shinto_events.10.j: "Ran, Goddess of the North, shall be our patron."
 TH_shinto_events.10.z: "Our patron is fine. Put the coin back."
