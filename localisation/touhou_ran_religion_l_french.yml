l_french:
 ###NINE-TAILED SHINTO (RAN)###
 th_ninetailedshinto: "Nine-Tailed Shinto"
 th_ninetailedshinto_religion_desc: "Nine-Tailed Shinto began as stories told by the stove about a clever golden fox, and somehow grew a priesthood. Its shrines honour the old Slavic gods by their old names. If those gods now look a lot like the residents of a certain hidden land in the east, the faithful are too polite to say so.\nEach ruler picks a patron from the pantheon, and the faith may keep a syncretic religion alongside it."
 th_harmonized_ninetailed_shinto: "Harmonized with Nine-Tailed Shinto"
 ###DEITIES###
 th_ran_perun: "Perun"
 th_ran_perun_desc: "God of thunder and war, and chief of the old gods. His new icons show a tall woman with a great ring of sacred rope on her back and a pillar in each hand, which the old songs never mentioned. Warriors pray to her anyway. She seems to enjoy it."
 th_ran_veles: "Veles"
 th_ran_veles_desc: "God of cattle, wealth and the underworld, and the trickiest of the old gods. These days Veles lends money at fair rates, wears round spectacles and has a big bushy tail that the priests leave out of the sermons."
 th_ran_mokosh: "Mokosh"
 th_ran_mokosh_desc: "Mother of the damp earth and keeper of the harvest. Her new icons show a cheerful girl in a hat hung with grapes, and the faithful swear her shrines smell faintly of baked sweet potatoes."
 th_ran_svarog: "Svarog"
 th_ran_svarog_desc: "The heavenly smith, who forged the sun and taught people to work iron. Lately the smith seems to have taken up jewellery: every village forge now hangs a string of bright stone beads over the anvil, for luck."
 th_ran_stribog: "Stribog"
 th_ran_stribog_desc: "Grandfather of the winds, who sends storms against enemy fleets and fair weather to his own. Sailors say his messengers have black wings, fly faster than any gale, and always want an interview for some newspaper."
 th_ran_dazhbog: "Dazhbog"
 th_ran_dazhbog_desc: "The sun god, giver of wealth and of the right to rule. His priests now teach that the sun lives inside a cheerful girl with raven wings, who carries it everywhere and should be kept well away from the granaries."
 th_ran_morana: "Morana"
 th_ran_morana_desc: "Goddess of winter and death, whose straw figure is drowned in the river every spring. She has never held it against anyone. Invaders who march in January find her very good company, and very hard to leave."
 th_ran_kot_bayun: "Bayun"
 th_ran_kot_bayun_desc: "Kot Bayun, the great cat of the fairy tales, whose stories put travellers to sleep. In this telling the cat is small, has two tails, hates baths, and comes running the moment Lady Ran calls."
 th_ran_devyatikhvostaya: "Zlata"
 th_ran_devyatikhvostaya_desc: "Zlata, \"the Golden One\", also called Devyatikhvostaya, \"the Nine-Tailed One\". The peasants of the north tell of a golden fox who keeps the tax books, settles their quarrels and answers prayers within the week. Nobody remembers her from the old songs. Nobody seems to mind."
 th_ran_goddess_of_the_north: "Ran"
 th_ran_goddess_of_the_north_desc: "Ran, Goddess of the North. Belief made the messenger a goddess. Ran no longer runs on anyone else's formula, and the whole North now prays to her by her real name."
 ###REBELS###
 th_ninetailed_rebels_title: "Religious"
 th_ninetailed_rebels_name: "$RELIGION$ Zealots"
 th_ninetailed_rebels_desc: "Religious fanatics tend to rise up in provinces controlled by nations of a different faith. They seek to spread their faith and smite all unbelievers."
 th_ninetailed_rebels_army: "$RELIGION$ Army"
 th_ninetailed_rebels_demand: "Convert $COUNTRYNAME$"
 th_ninetailed_rebels_demand_desc: "The religious rebels fight for the $RELIGION$ religion. They demand that we recognize its supremacy or at the very least cease our efforts to convert them and let them worship in peace."
