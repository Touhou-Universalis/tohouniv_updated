l_english:
 swamp: "Swamp"
 swamp_desc: "Swamp terrain represents tracts of wetland dominated by thick grasses, hardy trees and great stagnant ponds. Compared to marshes, swamps are much harder to navigate or develop as much of the surface is submerged."
 
 lunar_coast: "Lunar Coast"
 lunar_coast_desc: "Lunar coast terrain represents the areas where the lunar highlands recede into the maria below. The ocean possesses an ethereal quality to it."
 
 lunar_plains: "Lunar Plains"
 lunar_plains_desc: "Lunar plains terrain represents areas in low gravity covered in a thick layer of regolith hostile to virtually all life. The landscape has seen constant bombardment from outer space."
 
 lunar_hills: "Lunar Hills"
 lunar_hills_desc: "Lunar hills terrain represents areas dominated by a bumpy landscape of shifting elevation that are lower than mountains. Like lunar mountain terrain there is a thick layer of regolith hostile to life."
 
 lunar_mountains: "Lunar Mountain"
 lunar_mountains_desc: "Lunar mountain terrain represents areas occupied by smooth mountain ranges. Despite the high elevation and age of lunar mountains, they still have a thick layer of regolith hostile to life."
 
 lunar_urban: "Lunatic Urban"
 lunar_urban_desc: "Lunatic urban terrain represents areas dominated by monolithic oriental structures sprawling out for miles, tucked behind great walls. Vegetation seemingly exists in stasis."
 
 lunar_craters: "Lunar Crater"
 lunar_craters_desc: "Lunar crater terrain represents areas where a massive impact left behind a basin with thin layers of regolith. Sometimes depressions of this terrain are perfect circles, providing potential for a physical or magic barrier to create something liveable."
 
 lunar_forest: "Peach Grove"
 lunar_forest_desc: "Peach grove terrain represents medium density areas of peach forest. Their peculiar existence on extraterrestrial plains can only be attributed to divine sanctions."
 
 bamboo_forest: "Bamboo Forest"
 bamboo_forest_desc: "Bamboo forest terrain represents areas where very tall bamboo dominates the landscape."

 bamboo_jungle: "Bamboo Jungle"
 bamboo_jungle_desc: "Bamboo jungle terrain represents areas dominated by a high density of bamboo and exotic low growing vegetation. Like jungle, it is difficult for an army to maneuver."
 
 bamboo_hills: "Bamboo Hills"
 bamboo_hills_desc: "Bamboo hills terrain represents areas of high humidity dominated by a rolling landscape of shifting elevation. Local conditions have allowed for bamboo growth to dominate the landscape."
 
 bamboo_jungle: "Bamboo Jungle"
 bamboo_jungle_desc: "Bamboo jungle terrain represents areas overgrown with dense vegetation in flux with hardy bamboo species, difficult to maneuver or develop."
 
 bamboo_grove: "Bamboo Grove"
 bamboo_grove_desc: "Bamboo grove terrain represents areas of high humidity flatland with minimal shrubs or trees and patches of bamboo forest broken up with swathes of flatland, easy to maneuver or develop."
 
 heaven: "Keystone"
 heaven_desc: "Keystone terrain represents levitating masses of rock topped with plateaus. Extreme altitude and rockiness mean only hardy shrubs thrive."
 
 celestial_grassland: "Heavenly Meadow"
 celestial_grassland_desc: "Heavenly meadow terrain is characterized by cascading lush hills and grassland basked in constant sunlight cancelling out the chill of extreme altitude with a pleasant warmth. Flower bushes and trees dominate the landscape."
 
 celestial_hills: "Heavenly Valley"
 celestial_hills_desc: "Heavenly valley terrain represents areas of forest hills into wide crevasses tucking away mineral-rich rivers. These rivers abruptly drop down from extreme altitude, but the resulting waterfalls disperse into billowing vapor clouds painting a scenery of a great cloud factory in the sky."
 
 celestial_mountain: "Heavenly Moutain"
 celestial_mountain_desc: "Heavenly mountain terrain is characterized by steep elevations and hardy groves climbing to the absolute peak of the skies. Mineral formation in exposed cliffs glimmer a vibrant green color."
 
 celestial_urban: "Supraterrestrial Urban"
 celestial_urban_desc: "Supraterrestrial urban terrain represents areas dominated by artifical sprawl delicately weaving into and around the natural landscape with great care. Scenes of developed highways and lush forests exist in harmony."
 
 sunflower_steppe: "Sunflower Steppe"
 sunflower_steppe_desc: "Sunflower steppe terrain represents large continuous areas of golden plains unsuitable for grazing but are suitable for agriculture."

 flower_hill: "Flower Hills"
 flower_hill_desc: "Flower hills terrain represents areas dominated by a rolling landscape of shifting elevation dense in pollinating vegetation and light tree coverage."

 flower_field: "Flower Steppe"
 flower_field_desc: "Flower steppe terrain represents large continuous areas of colorful grassland unsuitable for grazing but are suitable for agriculture."

 fertile_fields: "Flower Farmlands"
 fertile_fields_desc: "Flower farmlands terrain represents areas where the landscape is dominated by wild grasses and flowers thriving on a rich earthbed."
 
 genbu_ravine: "High Ravine"
 genbu_ravine_desc: "High ravine terrain represents areas mostly woodlands torn up by waterfalls and jagged cliffs making navigation very perilous. High ravines are rugged like mountains, but supports greater densities of vegetation."
 
 ravine: "Low Ravine"
 ravine_desc: "Low ravine terrain represents areas predominantly woodlands torn up by rivers and rocky slopes providing ample fresh water. Low ravine terrain is rugged like mountains, but sustains a very rich biodiversity."

 sewer: "Sewer"
 sewer_desc: "Sewer terrain represents areas of the overworld intertwined with underworld networks of artificial tunnels stretching around for miles. The tunnels are large enough for armies to funnel through but contain toxic streams making this terrain an undesirable place to settle."

 kappa_urban: "Mechanical Sprawl"
 kappa_urban_desc: "Mechanical sprawl terrain represents areas neither characterized by climate and elevation, but rather by large areas automated mechanical tools and structures dominating the landscape. Everything from forests to rivers to quarries have been optimized by local workshops exploiting the material world at the expense of nature."
 
 scrapyard: "Scrapyard"
 scrapyard_desc: "Scrapyard terrain represents landscape shaped by artificial hills of discarded junk deposited by elusive river-dwelling youkai. Shattered objects and mangled metals make the area unsafe for armies to cross through."
 
 sanzu_bank: "Sanzu River"
 sanzu_bank_desc: "Sanzu river terrain represent areas of flatland strewn with dirt and gravel. A tumultuous river surges through area where souls and spirits of sinners illuminate the landscape, providing a means for vegetation to flourish."
  
 lily_steppe: "Lily Steppe"
 lily_steppe_desc: "Lily steppe terrain represents areas of dull peachy flats complemented by red spider lily fields where the trees are sparse or completely absent."

 bedrock_flatland: "Barren Plains"
 bedrock_flatland_desc: "Barren plains terrain represents wide areas of desolate rocky wastes unable to support vegetation without an earthbed."

 bedrock_highlands: "Barren Highlands"
 bedrock_highlands_desc: "Barren highlands terrain represents areas dominated by rolling landscape of shifting elevation that are lower and less steep than mountains. Unlike most highlands these areas are uniquely bare unable to support vegetation without an earthbed."

 hellish_bumps: "Hell Hills"
 hellish_bumps_desc: "Hell hills areas dominated by a rolling landscape of shifting elevation that are lower and less steep than mountains. Hell hills terrain are uniquely characterized by a gloomy red ambience and sharper temperature variations with a high density of trees and underbrush."

 perilous_forest: "Hell Forest"
 perilous_forest_desc: "Hell forest terrain represents areas of red tinted forest with high density of trees and underbrush."

 hell_forest: "Redwoods"
 hell_forest_desc: "Redwoods terrain represents areas of behemoth trees dominating the landscape. "

 baleful_plains: "Hell Grasslands"
 baleful_plains_desc: "Hell grasslands terrain represents vast tracts of reddish grasses and arable land."

 animal_realm: "Animal Metropolis"
 animal_realm_desc: "Animal Metropolis terrain represents areas of landscape dominated by a grid structure sprouting skyscrapers that kiss the sky making vegetation nearly impossible."

 genso_drylands: "Hell Badlands"
 genso_drylands_desc: "Hell badland terrain represents large flats blotted with hard rocky protrusions and an earthbed seared dry by the sun."

 cavern: "Cavern"
 cavern_desc: "Cavern terrain represents great spacious areas hiding under the bedrock layer, with varying levels of elevation. These cavernous pockets sometimes enable thriving ecosystems."

 terranean_cave: "Terranean Cave"
 terranean_cave_desc: "Terranean cave terrain represents areas of the overworld intertwined with pockets of underworld tucked around cliffs or geologically inactive conduits. While vegetation only exists on the surface, armies can move in 3 dimensions making this terrain a logistically challenge."
 
 subterranean_cavern: "Subterranean Cavern"
 subterranean_cavern_desc: "Subterranean cavern terrain represents areas deep below the earth characterized by vast enclosed networks of caves sometimes covered with dazzling speleothem. Ecosystems at this depth are almost non-existent."
 
 subterranean_ravine: "Subterranean Ravine"
 subterranean_ravine_desc: "Subterranean ravine terrain represents areas of jagged cavernous networks with little compromise for easy movement or development. Some canyons in this terrain retain ancient water deposits."
 
 subterranean_urban: "Subterranean Urban"
 subterranean_urban_desc: "Subterranean urban terrain represents areas subsumed by sprawling clean-cut road networks and constantly illuminated buildings very deep underground. The hard materials used to sculpt the caverns and lack of erosional forces keep this terrain perfectly preserved even without centuries of maintenance."
 
 subterranean_mansion: "Subterranean Mansion"
 subterranean_mansion_desc: "Subterranean mansion terrain represents swathes of chiseled and ornamented cave networks with wide spaces and singular buildings looming over the local pocket. Vegetation miraculously survives under constant care by local staffers in flat gardens."
 
 subterranean_labyrinth: "Subterranean Labyrinth"
 subterranean_labyrinth_desc: "Subterranean labyrinth terrain represents twisting contours deep underground winding into itself in 3 dimensions with no order and many dead ends. Navigating an army through this confusing terrain will incur certain casualities."
 
 blazing_cavern: "Blazing Cavern"
 blazing_cavern_desc: "Blazing cavern terrain represents areas of sizzling caves very deep underground churning over molten rock. Compared to subterranean caverns, blazing caverns are smoother due to molten activity. Are ravens vegetation?"

 blight_cavern: "Blighted Cavern"
 blight_cavern_desc: "Blighted cavern terrain represents spacious contours deep underground defined by paranormal activities. It feels as if a million souls are trapped in this terrain haunting anybody who dares enter."

 lush_cavern: "Lush Cavern"
 lush_cavern_desc: "Lush cavern terrain represents distinct caverns covered in moss and complex vegetation sustained by deep aquifers. The terrain's flow of filtered water and adapted life beckons to be tamed."
 
 aquatic_cavern: "Aquatic Cavern"
 aquatic_cavern_desc: "Aquatic cavern terrain represents disquieting networks of caves deep underground flooded to the deepest depths. Stagnant ponds trapping toxic elements further degrade any quality of life found in this terrain."
 
 hell_coastline: "Rugged Coastline"
 hell_coastline_desc: "Rugged coastline terrain represents isolated areas characterized by monolithic basalt cliffs denying waves from the sea any land. Vegetation is sparse to non-existant and volcanic activity is commonplace."

 blight: "Blight"
 blight_desc: "Blight terrain represents lands defined by excessive mystic activity. This terrain is said to be cursed and normal conditions don't apply here."
 
 blight_mansion: "Blighted Mansion"
 blight_mansion_desc: "Blighted forest terrain represents vast areas characterized by rotting boundaries forging a labyrinth centering derelict structures of multiple elevations."
 
 blight_forest: "Blight Forest"
 blight_forest_desc: "Blight forest terrain is characterized by areas of zombie vegetation where infectious trees rarely decompose. Blight forest is uniquely stagnant and hostile to unadapted life."

 blight_woods: "Blightwoods"
 blight_woods_desc: "Blightwoods terrain represents areas of broadleaf forest dense in decaying trees and underbrush. Despite some damp conditions, this terrain is too cold and arid to become a swamp."

 fungi_forest: "Fungi Forest"
 fungi_forest_desc: "Fungi forest terrain represents areas of mixed forests with high density of trees. A damp earthbed supports diverse species of mushrooms and mycelium."
 
 enchanted_forest: "Enchanted Forest"
 enchanted_forest_desc: "Enchanted forest terrain represents areas of mixed forests with high density of trees and underbrush. Compared to normal forest terrain, enchanted forests are notoriously wilder and difficult to navigate."
 
 astral_border: "Gap"
 astral_border_desc: "Gap terrain is the way to Gensokyo in Gensokyo" #G̸͖̐ͅa̵̬͓͋͛́p̷̨͙͍͝ ̸̙͕̥̃t̵̼̒é̷͖͒͝r̴̻̾̌͝r̷͍̫̋̄̈́á̶͖̮i̶̟̫͌n̸̂͜ ̶͉̱̆͝ĭ̸͍̐s̵̱͋̐ͅ ̵̤͍̃́̾ṭ̷̐̿̾h̸̼̳͉̑̑͝e̸̳̼͝ ̴͎̻̓͆ẁ̷̡̰ă̴̪̏̀y̴̨̛̭̬͛ ̵̡͚͑ţ̴̗̟̅͐̄o̵̹͛͗ ̴̡̛͚͓̂͝Ĝ̷̞̔̓è̸̛̥̜̃n̴͖̞͋̅s̴͈̰͙̅̊͝o̷̯͚͋́̈́k̴̗̏̔y̸̩̐ö̷̗̞͓͆ṵ̵̈́̄̚ͅ ̶̻̪̃ț̵̫́͂̈ǫ̸̪̯̾̕ ̷̹̖̆̅G̷̡̛̭͑͐e̸̩̠͆n̷̪͝s̸̹̈́͐͝o̶̡̯͗͠͝k̷̠̣̲̆͝y̸͓͂͑ȯ̵̩͘ ̵̰̉͌ị̶̄n̵͈̤̯͂ ̷̰͎̈̾G̶͈̊̂͂ė̷̱ͅn̷̘̪͒ś̷͓̣̥o̶̢̟̗͑̍k̶̹̅y̴͕̅ŏ̸̜̦̉̆
 
 urban: "Urban"
 urban_desc: "Urban terrain represents areas subsumed by sprawling road networks and buildings constructed over centuries with care, standing the test of time."

 suburban_village: "Suburban"
 suburban_village_desc: "Suburban terrain represents areas of farmland and interconnected villages creating a robust local economy and where all wilderness has been domesticated."

 industrial_urban: "Industrial Sprawl"
 industrial_urban_desc: "Industrial sprawl terrain represents wide areas of land where all vegetation has been crushed under the march of artificial pavings and structures. Like all urban environment, armies have a hard time securing these labyrinths."

 abandonned_village: "Abandonned Village"
 abandonned_village_desc: "Abandonned village terrain represents tracts of overgrown farmlands and settlements in the midst of wild nature's reclaimation. For an army the land is useless and difficult to navigate."
 
 dreamscape: "Dreamscape"
 dreamscape_desc: "Dreamscape terrain represents areas devoid of vegetation or physical features. A dreamscape is a transitional zone active deep in REM sleep. Due to it's enigmatic nature, it's impossible to be compared to anything but an invisible ocean."
 
 space_ship: "Aluminum Can"
 space_ship_desc: "Aluminum can terrain represents the tight areas where movement is restricted to corridors and stairwells. Without a natural earthbed, vegetation in this area only exists in vertical farms."
 
 ashland: "Ashland"
 ashland_desc: "Ashland terrain represents areas covered in thick layers of soot or rubble caused by natural or youkai-made mechanisms. There is nothing to develop here but the ash often makes rich fertilizer for irrigation."

 makai_plains: "Hell Wastes"
 makai_plains_desc: "Hell waste terrain represents tracts of barren land devoid of vegetation and high geothermal activity. Extreme conditions make maneuvering an army through perilous."

 makai_mountain: "Volcano"
 makai_mountain_desc: "Volcano terrain represents areas completely dominated by geothermal activity streaming through the earth and ontop the existing bedrock. This terrain is extremely inhospitable but valuable."

 makai_forest: "Darkwoods"
 makai_forest_desc: "Darkwoods terrain represents areas of warm forest overgrown with lichen on a sulfur-rich soil bed."

 crystal_forest: "Crystal Forest"
 crystal_forest_desc: "Crystal forest terrain represents vast areas of crystalline protrusions resembling overworld trees densely sprawled on top of geothermally active plains."
 
 scarlet_devil_mansion: "Endless Mansion"
 scarlet_devil_mansion_desc: "Endless mansion terrain represents a capacious labyrinth of rooms and hallways divided by many doors. Vegetation in this area has been condemned to small elaborate pots."

 misty_lake_shore: "Misty Shoreline"
 misty_lake_shore_desc: "Misty shoreline terrain represents areas of coastline shadowed in vicious vapor cooling off the landscape to very low temperatures all year round. These stretches of coastline are usually treeless."
 
 #Tengu
 
 autumn_hills: "Autumn Hills"
 autumn_hills_desc: "Autumn hills terrain represents areas dominated by steady rolling landscape of shifting elevation trending in one direction. Unlike normal hills, autumn hills represent high densities of trees with unique properties due to elevation."
 
 tengu_mountain: "Youkai Mountain"
 tengu_mountain_desc: "Youkai mountain terrain represents areas occupied by wide mountains ranges hoisting unstable passes at high altitude and dry. Most vegetation cannot cope with the high elevation leaving the rock bare."
 
 autumn_highlands: "Autumn Highland"
 autumn_highlands_desc: "Autumn highland terrain represents areas dominated by a rolling landscape of shifting elevation trending in one direction. Autumn hills differ from normal highlands by supporting varying densities of very rare tree species adapted to high elevations and fertile soil." 
 
 tengu_urban: "Youkai Urban"
 tengu_urban_desc: "Youkai urban terrain represents rugged sloping areas of high elevation settled on by dozens of fortified towns interconnected with hardy bridges. Despite physical divisions, the infrastructure facilitates constant hustle and bustle between local citystates."
 
 
 
 
 #Vanilla 2hu Hijack
 
 genso_hills: "Hills"
 genso_hills_desc: "Hills terrain represents areas dominated by a rolling landscape of shifting elevation that are lower and less steep than mountains. Unlike the highland terrain hills represent areas with a higher density of trees and underbrush."

 genso_mountains: "Mountains"
 genso_mountains_desc: "Mountain terrain represents areas mainly occupied by steady rugged mountain ranges and narrow passes, often on high altitude and cold in climate."

 genso_highlands: "Highlands"
 genso_highlands_desc: "Highlands terrain represents areas dominated by rolling landscape of shifting elevation that are lower and less steep than mountains. Unlike the hills terrain highlands represent areas with a lower density of trees and underbrush."

 genso_forest: "Forest"
 genso_forest_desc: "Forest terrain represents areas of evergreen forest with high density of trees and underbrush."

 genso_woods: "Woods"
 genso_woods_desc: "Woods terrain represents areas of broadleaf forest with high density of trees and underbrush."

 genso_jungle: "Jungle"
 genso_jungle_desc: "Jungle terrain represents areas overgrown with dense tropical vegetation, difficult for an army to maneuver in."

 genso_coastline: "Coastline"
 genso_coastline_desc: "Coastline terrain represents the narrow areas where land and sea meet, comprised of cliffs or sand dunes."

 genso_marsh: "Marsh"
 genso_marsh_desc: "Marsh terrain represents tracts of wetland dominated by grasses or low-growing scrubs."

 genso_grasslands: "Grasslands"
 genso_grasslands_desc: "Grasslands terrain represents areas of farmland where the vegetation is dominated by grass."

 genso_farmlands: "Farmlands"
 genso_farmlands_desc: "Farmlands terrain represents highly cultivated areas where the landscape is dominated by agriculture and towns or villages."

 genso_steppes: "Steppes"
 genso_steppes_desc: "Steppes terrain represents large and continuous open areas covered in grass that are suitable for grazing yet unsuitable for agriculture."

 genso_glacier: "Glacial"
 genso_glacier_desc: "The Glacial terrain represents areas with very harsh and cold conditions often with permanent snow coverage and glaciers. Areas with Glacial terrain are very inhospital for human settlement or military maneuvers."

 genso_desert: "Desert"
 genso_desert_desc: "Desert terrain represents desolate and arid areas with little or no vegetation, often in a very warm climate."
 
 genso_coastal_desert: "Coastal Desert"
 genso_coastal_desert_desc: "Coastal Desert terrain represents areas where the desert meets the ocean, resulting in a milder and less inhospitable climate."

 #Nether
 
 nether_grassland: "Nether Plain"
 nether_grassland_desc: "Nether plain terrain represents areas of cold farmland where the vegetation is dominated by hardy grass and underbrush."

 nether_forest: "Nether Forest"
 nether_forest_desc: "Nether forest terrain represents areas of broadleaf forests with high density of trees and underbrush."

 nether_urban: "Nether Urban"
 nether_urban_desc: "Nether urban terrain represents areas subsumed by sprawling road networks and buildings constructed over centuries with care, standing the test of time."
 
 snow_field: "Snow Plains"
 snow_field_desc: "Snow plains terrain represents areas of flatland with semi-permanent snow coverage, typically found in areas with high precipitation and low temperatures."

 snow_forest: "Snow Forest"
 snow_forest_desc: "Snow woods terrain represents areas of conifer forest with semi-permanent snow coverage masking a high density of underbrush."
 
 #scrapped

 tengu_plateau: "Youkai Plateau"
 tengu_plateau_desc: "Youkai plateau terrain represents areas of highly elevated flatlands with only subtle shifts of elevation and minimal vegetation, similar to the highland terain."
 
 






 
